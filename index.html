<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Housebets — Sports</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{ink:'#0a0e13',panel:'#111823',line:'#1d2734',lime:'#c8ff3d',muted:'#8a96a8',amber:'#f5b544'}}}}</script>
<style>
*{-webkit-tap-highlight-color:transparent}
body{background:#0a0e13;color:#e8eef7;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;font-feature-settings:"tnum"}
.card{background:#111823;border:1px solid #1d2734;border-radius:14px}
.odd{background:#182231;border:1px solid #22303f;border-radius:9px;padding:9px 4px;text-align:center;cursor:pointer;transition:.15s;width:100%;font-variant-numeric:tabular-nums}
.odd:hover{border-color:#c8ff3d;background:#1c2836}
.odd.sel{background:#c8ff3d;color:#0a0e13;border-color:#c8ff3d;font-weight:700}
.odd.susp{opacity:.3;cursor:not-allowed;text-decoration:line-through}
.odd.chg{background:#f5b544;color:#0a0e13;border-color:#f5b544;font-weight:700}
.pill{background:#182231;border:1px solid #22303f;border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;white-space:nowrap;color:#e8eef7;transition:.15s}
.pill:hover{border-color:#c8ff3d}
.pill.on{background:#c8ff3d;color:#0a0e13;border-color:#c8ff3d;font-weight:600}
.nav{padding:9px 12px;border-radius:9px;cursor:pointer;color:#8a96a8;font-size:14px;background:none;border:none;width:100%;text-align:left;transition:.12s}
.nav:hover{background:#182231;color:#e8eef7}
.nav.on{background:#182231;color:#c8ff3d;font-weight:600}
.scroll::-webkit-scrollbar{height:5px}.scroll::-webkit-scrollbar-thumb{background:#1d2734;border-radius:99px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.live-dot{width:6px;height:6px;border-radius:50%;background:#ef4444;animation:pulse 1.4s infinite;display:inline-block}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SPORTS=[['⚽','Football','football'],['🏀','Basketball','basketball'],['🎾','Tennis','tennis'],['🏒','Hockey','hockey'],['🥊','MMA','mma'],['🏏','Cricket','cricket']];
const LEAGUES=['Premier League','Champions League','LaLiga','Serie A','Bundesliga'];

const MATCHES=[
{id:1,sport:'football',league:'Premier League',home:'Arsenal',away:'Brighton',hs:2,as:1,min:67,live:true,o:[2.10,3.40,3.60],fav:'H'},
{id:2,sport:'football',league:'Premier League',home:'Chelsea',away:'Newcastle',hs:0,as:0,min:31,live:true,o:[2.45,3.20,2.90]},
{id:3,sport:'football',league:'LaLiga',home:'Real Madrid',away:'Sevilla',hs:1,as:0,min:54,live:true,o:[1.35,5.00,8.50],fav:'H'},
{id:4,sport:'football',league:'Serie A',home:'Inter',away:'Roma',hs:2,as:2,min:78,live:true,o:[1.90,3.60,3.90]},
{id:5,sport:'football',league:'Bundesliga',home:'Bayern',away:'Dortmund',hs:1,as:1,min:45,live:true,o:[1.70,4.00,4.20],ht:true},
{id:6,sport:'football',league:'Champions League',home:'Man City',away:'PSG',hs:0,as:0,min:12,live:true,o:[1.85,3.80,4.00]},
{id:7,sport:'basketball',league:'NBA',home:'Lakers',away:'Celtics',hs:78,as:82,min:38,live:true,o:[2.05,1.78]},
{id:8,sport:'tennis',league:'ATP Masters',home:'Alcaraz',away:'Sinner',hs:1,as:1,min:0,live:true,o:[1.65,2.20],sets:true},
{id:9,sport:'football',league:'Premier League',home:'Liverpool',away:'Everton',hs:0,as:0,min:-90,live:false,o:[1.45,4.20,6.50]},
{id:10,sport:'football',league:'LaLiga',home:'Barcelona',away:'Atletico',hs:0,as:0,min:-180,live:false,o:[1.95,3.40,3.80]},
{id:11,sport:'football',league:'Champions League',home:'Bayern',away:'Real Madrid',hs:0,as:0,min:-1440,live:false,o:[2.30,3.50,2.90]},
{id:12,sport:'basketball',league:'NBA',home:'Warriors',away:'Suns',hs:0,as:0,min:-300,live:false,o:[1.90,1.90]},
{id:13,sport:'football',league:'Serie A',home:'Milan',away:'Juventus',hs:0,as:0,min:-240,live:false,o:[2.15,3.30,3.40]},
{id:14,sport:'tennis',league:'ATP Masters',home:'Djokovic',away:'Medvedev',hs:0,as:0,min:-360,live:false,o:[1.80,2.00]}
];

const MARKETS={
Popular:[['Match Result',['Home','Draw','Away'],[2.10,3.40,3.60]],['Both Teams to Score',['Yes','No'],[1.72,2.05]],['Total Goals 2.5',['Over','Under'],[1.88,1.92]],['Draw No Bet',['Home','Away'],[1.55,2.40]]],
Goals:[['Total Goals 1.5',['Over','Under'],[1.30,3.40]],['Total Goals 3.5',['Over','Under'],[2.60,1.48]],['Home Team Goals 1.5',['Over','Under'],[1.95,1.80]],['Away Team Goals 0.5',['Over','Under'],[1.55,2.35]]],
Halves:[['1st Half Result',['Home','Draw','Away'],[2.60,2.10,4.20]],['2nd Half Result',['Home','Draw','Away'],[2.20,2.40,4.60]],['1st Half Over 0.5',['Yes','No'],[1.42,2.70]],['Both Halves Over 0.5',['Yes','No'],[2.10,1.68]]],
Handicaps:[['Home -1',['Home','Away'],[1.95,1.85]],['Away +1',['Home','Away'],[1.70,2.10]],['Asian Handicap 0.5',['Home','Away'],[1.88,1.92]],['European -1.5',['Home','Away'],[2.40,1.55]]],
Goalscorers:[['Anytime — Saka',['Yes','No'],[2.30,1.55]],['Anytime — Havertz',['Yes','No'],[2.60,1.45]],['Anytime — Mitoma',['Yes','No'],[3.40,1.28]],['Anytime — Welbeck',['Yes','No'],[3.80,1.22]]],
'Corners & cards':[['Total Corners 9.5',['Over','Under'],[1.85,1.90]],['Home Most Corners',['Yes','No'],[1.75,2.00]],['Card in Match',['Yes','No'],[1.40,2.70]],['Over 3.5 Cards',['Yes','No'],[2.20,1.62]]]
};

const state={route:'home',matchId:1,slip:[],stake:10,bets:[{id:1,label:'Liverpool v Everton',pick:'Liverpool',market:'Match Result',odds:1.45,stake:25,state:'settled',time:'Yesterday 20:14'},{id:2,label:'Real Madrid v Sevilla',pick:'Real Madrid',market:'Match Result',odds:1.35,stake:50,state:'open',time:'Today 21:02'}],follows:new Set(),liveFilter:'all',marketTab:'Popular',betsTab:'open',search:'',toast:null,susp:{},slipOpen:false};
const $=id=>document.getElementById(id);
const byId=id=>MATCHES.find(m=>m.id===id);
const liveList=()=>MATCHES.filter(m=>m.live);
const soonList=()=>MATCHES.filter(m=>!m.live);
const pot=()=>state.slip.reduce((a,s)=>s.status==='ok'?a+state.stake*s.odds:a,0);
const slipKey=s=>`${s.matchId}|${s.market}|${s.pick}`;
const isSusp=k=>{if(!(k in state.susp))state.susp[k]=Math.random()<0.06;return state.susp[k]};
const clockStr=m=>{if(m.ht)return 'HT';if(m.sets)return 'Set 3';if(!m.live){if(m.min===-90)return 'Today 20:00';if(m.min===-180)return 'Today 21:30';if(m.min===-1440)return 'Tomorrow 20:00';if(m.min===-300)return 'Tomorrow 02:00';if(m.min===-240)return 'Today 19:45';if(m.min===-360)return 'Tomorrow 14:00';return 'Soon'}return m.min+"'"};
const mg=id=>{const m=byId(id);if(!m._m)m._m=JSON.parse(JSON.stringify(MARKETS));return m._m};

function go(r){location.hash='#/'+r}
function toast(t,ok){state.toast={t,ok};render();setTimeout(()=>{if(state.toast&&state.toast.t===t){state.toast=null;render()}},3500)}

function addOdd(m,market,pick,odds){
  const sel={matchId:m.id,label:`${m.home} v ${m.away}`,market,pick,odds,status:'ok',old:odds};
  const k=slipKey(sel);
  const ex=state.slip.find(x=>slipKey(x)===k);
  if(ex){state.slip=state.slip.filter(x=>slipKey(x)!==k);return render()}
  const r=Math.random();
  if(r<0.16){sel.status='changed';sel.old=odds;sel.odds=+(odds+(Math.random()*0.28-0.14)).toFixed(2)}
  else if(r<0.26){sel.status='susp'}
  state.slip.push(sel);render();
}
function acceptOdds(k){const s=state.slip.find(x=>slipKey(x)===k);if(s)s.status='ok';render()}
function removeSel(k){state.slip=state.slip.filter(x=>slipKey(x)!==k);render()}
function placeBet(){
  if(!state.slip.length||state.slip.some(s=>s.status!=='ok'))return;
  if(Math.random()<0.1){state.slip=state.slip.map(s=>({...s,status:'susp'}));return toast('Bet failed — a market moved. Please review.')}
  const now=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  state.slip.forEach(s=>state.bets.unshift({id:Date.now()+Math.random(),label:s.label,pick:s.pick,market:s.market,odds:s.odds,stake:state.stake,state:'open',time:now}));
  state.slip=[];state.route='bets';location.hash='#/bets';toast('Bet placed successfully.');render();
}

function oddCell(m,market,pick,odds){
  const k=`${m.id}|${market}|${pick}`;const sel=state.slip.find(s=>slipKey(s)===k);
  let cls='odd';
  if(sel)cls+=(sel.status==='susp'?' susp':sel.status==='changed'?' chg':' sel');
  return `<button class="${cls}" onclick="event.stopPropagation();addOdd(byId(${m.id}),'${market}','${pick}',${odds})">${odds.toFixed(2)}</button>`;
}

function row(m){
  const three=m.o.length===3;
  const picks=three?[m.home,'Draw',m.away]:[m.home,m.away];
  return `<div class="card p-3 mb-2 cursor-pointer hover:border-lime/50" onclick="go('match/${m.id}')">
    <div class="flex justify-between items-center mb-2">
      <div class="text-[11px] text-muted">${m.league}</div>
      <div class="flex items-center gap-1.5 text-[11px] ${m.live?'text-lime':'text-muted'}">${m.live?'<span class="live-dot"></span>':''}${clockStr(m)}</div>
    </div>
    <div class="flex items-center gap-3">
      <div class="flex-1 min-w-0">
        <div class="font-semibold text-[13.5px] truncate">${m.home}</div>
        <div class="font-semibold text-[13.5px] truncate">${m.away}</div>
      </div>
      ${m.live?`<div class="text-right pr-1 leading-tight"><div class="text-lime font-bold text-base">${m.hs}</div><div class="text-lime font-bold text-base">${m.as}</div></div>`:''}
      <div class="grid ${three?'grid-cols-3':'grid-cols-2'} gap-1.5 w-[58%] sm:w-[52%]">
        ${m.o.map((o,i)=>`<div>${oddCell(m,'Match Result',picks[i],o)}</div>`).join('')}
      </div>
    </div>
  </div>`;
}

function searchHits(){
  const q=state.search.toLowerCase().trim();if(!q)return '';
  const out=[];
  MATCHES.forEach(m=>{if((m.home+' '+m.away+' '+m.league).toLowerCase().includes(q))out.push(`<div class="px-3 py-2 hover:bg-line/40 cursor-pointer text-sm border-b border-line/40" onclick="go('match/${m.id}')"><span class="font-medium">${m.home} v ${m.away}</span> <span class="text-muted text-xs">· ${m.league}</span></div>`)});
  LEAGUES.forEach(l=>{if(l.toLowerCase().includes(q))out.push(`<div class="px-3 py-2 hover:bg-line/40 cursor-pointer text-sm border-b border-line/40" onclick="go('football')">${l} <span class="text-muted text-xs">· Competition</span></div>`)});
  ['Match Result','Both Teams to Score','Total Goals 2.5','Anytime Goalscorer','Corners & cards'].forEach(mk=>{if(mk.toLowerCase().includes(q))out.push(`<div class="px-3 py-2 text-sm text-muted">${mk} <span class="text-xs">· Market</span></div>`)});
  return out.join('')||'<div class="p-4 text-sm text-muted text-center">No results for "'+state.search+'"</div>';
}

function pageHome(){
  return `<div class="mb-4 relative">
    <input value="${state.search}" oninput="state.search=this.value;document.getElementById('hits').innerHTML=searchHits();document.getElementById('hits').classList.toggle('hidden',!this.value)"
      placeholder="Search teams, players, competitions, markets"
      class="w-full bg-panel border border-line rounded-xl pl-10 pr-4 py-3 text-sm outline-none focus:border-lime"/>
    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-muted text-lg">⌕</span>
    <div id="hits" class="card mt-2 max-h-72 overflow-auto ${state.search?'':'hidden'}">${searchHits()}</div>
  </div>
  <div class="flex gap-2 overflow-x-auto pb-3 scroll">${SPORTS.map(([e,n,k])=>`<button class="pill ${state.liveFilter===k?'on':''}" onclick="state.liveFilter='${k}';render()">${e} ${n}</button>`).join('')}</div>
  <h2 class="text-lg font-bold mt-5 mb-2 flex items-center gap-2"><span class="live-dot"></span>Live now</h2>
  ${liveList().slice(0,6).map(row).join('')}
  <h2 class="text-lg font-bold mt-6 mb-2">Starting soon</h2>
  ${soonList().slice(0,4).map(row).join('')}
  <h2 class="text-lg font-bold mt-6 mb-2">Top competitions</h2>
  <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
    ${LEAGUES.map(l=>`<div class="card p-3 hover:border-lime/50 cursor-pointer" onclick="go('football')"><div class="font-semibold text-sm">${l}</div><div class="text-muted text-[11px] mt-1">${MATCHES.filter(m=>m.league===l).length} matches · Follow</div></div>`).join('')}
  </div>`;
}

function pageLive(){
  const list=liveList().filter(m=>state.liveFilter==='all'||m.sport===state.liveFilter);
  return `<h1 class="text-2xl font-bold mb-1">Live</h1><p class="text-muted text-sm mb-4">Every match in play</p>
  <div class="flex gap-2 overflow-x-auto pb-3 scroll">
    <button class="pill ${state.liveFilter==='all'?'on':''}" onclick="state.liveFilter='all';render()">All</button>
    ${SPORTS.map(([e,n,k])=>`<button class="pill ${state.liveFilter===k?'on':''}" onclick="state.liveFilter='${k}';render()">${e} ${n}</button>`).join('')}
  </div>
  ${list.length?list.map(row).join(''):`<div class="card p-8 text-center mt-4"><div class="text-4xl mb-2">⏳</div><div class="font-semibold mb-1">Nothing live right now</div><div class="text-muted text-sm mb-4">Here's what's starting soon</div><div class="text-left">${soonList().slice(0,3).map(row).join('')}</div></div>`}`;
}

function pageFootball(){
  return `<h1 class="text-2xl font-bold mb-1">Football</h1><p class="text-muted text-sm mb-4">Top five European leagues</p>
  ${LEAGUES.map(l=>{
    const ms=MATCHES.filter(m=>m.league===l);if(!ms.length)return '';
    const f=state.follows.has(l);
    return `<div class="mb-5"><div class="flex justify-between items-center mb-2"><h2 class="font-bold">${l}</h2>
      <button class="pill ${f?'on':''}" onclick="state.follows.has('${l}')?state.follows.delete('${l}'):state.follows.add('${l}');render()">${f?'Following':'Follow'}</button></div>
      ${ms.map(row).join('')}</div>`}).join('')}`;
}

function pageMatch(){
  const m=byId(state.matchId);if(!m)return '<div class="text-muted">Match not found.</div>';
  const data=mg(m.id);const tabs=Object.keys(data);
  let groups=data[state.marketTab]||[];
  if(state.marketTab==='Popular'&&m.o.length===3)groups=groups.map(g=>g[0]==='Match Result'?['Match Result',[m.home,'Draw',m.away],m.o]:g);
  return `<button class="text-muted text-sm mb-3 hover:text-lime" onclick="go('home')">← Back</button>
  <div class="card p-4 mb-4">
    <div class="flex justify-between text-xs text-muted mb-2"><span>${m.league}</span><span class="${m.live?'text-lime':''} flex items-center gap-1.5">${m.live?'<span class="live-dot"></span>':''}${clockStr(m)}</span></div>
    <div class="flex items-center justify-between gap-4">
      <div class="flex-1 min-w-0"><div class="font-bold text-lg truncate">${m.home}</div><div class="font-bold text-lg truncate">${m.away}</div></div>
      <div class="text-right leading-tight"><div class="text-3xl font-black text-lime">${m.hs}</div><div class="text-3xl font-black text-lime">${m.as}</div></div>
    </div>
  </div>
  <div class="flex gap-2 overflow-x-auto pb-3 scroll mb-2">${tabs.map(t=>`<button class="pill ${state.marketTab===t?'on':''}" onclick="state.marketTab='${t}';render()">${t}</button>`).join('')}</div>
  ${groups.map(([name,picks,odds])=>{
    const k=m.id+'|'+state.marketTab+'|'+name;const susp=isSusp(k);
    return `<div class="card p-3 mb-2"><div class="flex justify-between items-center mb-2">
      <div class="font-semibold text-sm">${name}</div>
      ${susp?'<span class="text-[10px] px-2 py-0.5 rounded bg-red-500/20 text-red-400 font-semibold">SUSPENDED</span>':'<span class="text-[10px] text-muted">▲▼ live</span>'}
      </div>
      <div class="grid ${picks.length===3?'grid-cols-3':'grid-cols-2'} gap-1.5">
        ${picks.map((p,i)=>`<div><div class="text-[10px] text-muted mb-1 text-center truncate">${p}</div>${susp?`<button class="odd susp">${odds[i].toFixed(2)}</button>`:oddCell(m,name,p,odds[i])}</div>`).join('')}
      </div></div>`}).join('')}`;
}

function slipLine(s){
  const k=slipKey(s);
  let badge='';
  if(s.status==='susp')badge='<span class="text-[9px] px-1.5 py-0.5 rounded bg-red-500/20 text-red-400 font-semibold">SUSPENDED</span>';
  if(s.status==='changed')badge='<span class="text-[9px] px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-400 font-semibold">ODDS MOVED</span>';
  return `<div class="border-b border-line py-2.5">
    <div class="flex justify-between gap-2 mb-1">
      <div class="min-w-0 flex-1"><div class="text-[11px] text-muted truncate">${s.label}</div>
      <div class="text-sm font-semibold truncate">${s.pick}</div>
      <div class="text-[10px] text-muted flex items-center gap-1.5 mt-0.5">${s.market} ${badge}</div></div>
      <div class="text-right shrink-0"><div class="font-bold text-sm">${s.odds.toFixed(2)}</div>
      ${s.status==='changed'?`<div class="text-[10px] text-muted line-through">${s.old.toFixed(2)}</div>`:''}
      <button class="text-[10px] text-muted hover:text-red-400 mt-1" onclick="removeSel('${k}')">Remove</button></div>
    </div>
    ${s.status==='changed'?`<button class="w-full text-xs bg-amber-500/20 text-amber-300 hover:bg-amber-500/30 rounded-md py-1.5 mt-1" onclick="acceptOdds('${k}')">Accept new odds → ${s.odds.toFixed(2)}</button>`:''}
  </div>`;
}

function slipBody(){
  if(!state.slip.length)return `<div class="text-center py-10 text-muted text-sm">Your slip is empty.<br><span class="text-xs">Tap any odds to add a single.</span></div>`;
  const bad=state.slip.some(s=>s.status!=='ok');
  return `<div class="mb-3">${state.slip.map(slipLine).join('')}</div>
  <div class="bg-ink/60 rounded-lg p-3">
    <div class="flex justify-between text-[11px] text-muted mb-1"><span>Stake (USDT)</span><span>Singles only</span></div>
    <input type="number" min="1" value="${state.stake}" oninput="state.stake=+this.value||0;document.querySelectorAll('.pot').forEach(e=>e.textContent=pot().toFixed(2))" class="w-full bg-panel border border-line rounded-md px-3 py-2 text-sm outline-none focus:border-lime"/>
    <div class="flex justify-between mt-2 text-sm"><span class="text-muted">Potential return</span><span class="font-bold text-lime"><span class="pot">${pot().toFixed(2)}</span> USDT</span></div>
    <button ${bad?'disabled':''} onclick="placeBet()" class="w-full mt-3 rounded-lg py-2.5 font-bold text-sm transition ${bad?'bg-line text-muted cursor-not-allowed':'bg-lime text-ink hover:opacity-90'}">${bad?'Resolve selections first':'Place bet'}</button>
  </div>`;
}

function pageBets(){
  const list=state.bets.filter(b=>state.betsTab==='open'?b.state==='open':b.state!=='open');
  return `<h1 class="text-2xl font-bold mb-4">Bet slip & My bets</h1>
  <div class="grid lg:grid-cols-2 gap-4">
    <div class="card p-4"><h2 class="font-bold mb-3 flex items-center justify-between">Bet slip <span class="text-[10px] text-muted font-normal">Singles only</span></h2>${slipBody()}</div>
    <div class="card p-4">
      <div class="flex justify-between items-center mb-3"><h2 class="font-bold">My bets</h2>
        <div class="flex gap-1">${['open','settled'].map(t=>`<button class="pill text-xs ${state.betsTab===t?'on':''}" onclick="state.betsTab='${t}';render()">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></div>
      ${list.length?list.map(b=>`<div class="border-b border-line py-2.5 last:border-0">
        <div class="flex justify-between text-[10px] text-muted mb-1"><span>${b.time} · Single</span><span class="uppercase font-semibold ${b.state==='open'?'text-lime':'text-muted'}">${b.state}</span></div>
        <div class="text-[11px] text-muted truncate">${b.label}</div>
        <div class="text-sm flex justify-between mt-0.5"><span>${b.pick}</span><span class="font-bold">${b.odds.toFixed(2)}</span></div>
        <div class="flex justify-between text-[11px] mt-1 text-muted"><span>Stake ${b.stake} USDT</span><span class="text-lime font-semibold">Return ${(b.stake*b.odds).toFixed(2)} USDT</span></div>
        ${b.state==='open'?`<button class="mt-1.5 text-[11px] text-lime hover:underline" onclick="toast('Cash out requested — demo only.',true)">Cash out ${(b.stake*0.92).toFixed(2)} USDT</button>`:''}
      </div>`).join(''):'<div class="text-center py-8 text-muted text-sm">No bets yet.</div>'}
    </div>
  </div>`;
}

const NAV=[['home','Sports'],['live','Live'],['football','Football'],['bets','Bet slip & My bets']];

function shell(html){
  return `<hea
