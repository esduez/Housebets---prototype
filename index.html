<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Housebets — Sportsbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  /* Housebets Koyu Lacivert Paleti */
  --bg: #0b141c;
  --surface: #121c24;
  --surface-2: #192833;
  --surface-3: #233442;
  --border: #1c2a36;
  --text: #ffffff;
  --text-2: #8b9eb0;
  --accent: #00e5ff; /* Housebets Turkuazı */
  --accent-dim: rgba(0, 229, 255, 0.15);
  --live: #ff4444;
  --warn: #ffaa00;
  --radius: 12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  font-feature-settings:'tnum';
  -webkit-font-smoothing:antialiased;
  padding-bottom: 80px;
}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{display:none}

/* Logo Font */
.logo-font{font-family:'Poppins',sans-serif;letter-spacing:-0.04em}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);transition:border-color .2s}
.card:hover{border-color:var(--surface-3)}

/* Pills */
.pill{
  background:var(--surface-2);border:1px solid var(--border);
  border-radius:999px;padding:8px 16px;font-size:12px;font-weight:700;
  cursor:pointer;white-space:nowrap;color:var(--text-2);
  transition:all .2s;display:flex;align-items:center;gap:6px;
}
.pill.on{background:var(--accent);color:#000;border-color:var(--accent)}

/* Tabs */
.tab{flex:1;padding:12px;text-align:center;font-size:13px;font-weight:700;color:var(--text-2);border-bottom:2px solid transparent;cursor:pointer;transition:all .2s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-dim)}

/* Nav */
.nav{
  padding:10px 14px;border-radius:8px;cursor:pointer;
  color:var(--text-2);font-size:13px;font-weight:600;
  background:none;border:none;width:100%;text-align:left;
  transition:all .15s;display:flex;align-items:center;gap:12px;
}
.nav:hover{background:var(--surface-2);color:var(--text)}
.nav.on{background:var(--accent-dim);color:var(--accent)}

/* Match Row */
.match-row{
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:12px;margin-bottom:6px;
  cursor:pointer;transition:all .2s;
}
.match-row:hover{border-color:var(--accent);background:var(--surface-2)}

/* League Header */
.league-h{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 12px;background:var(--surface-2);
  border-left:3px solid var(--accent);border-radius:6px;
  margin:16px 0 6px;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;
}

/* Live */
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--live);display:inline-block;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}

/* Odds */
.odds-labels{display:grid;gap:4px;font-size:9px;color:var(--text-2);text-align:center;margin-bottom:4px;font-weight:700;letter-spacing:.03em}
.odds{
  background:var(--surface-2);border:1px solid var(--border);
  border-radius:8px;padding:10px 6px;width:100%;
  text-align:center;font-weight:700;font-size:13px;
  color:var(--text);font-variant-numeric:tabular-nums;
  transition:all .18s cubic-bezier(0.4,0,0.2,1);
}
.odds:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,229,255,0.15)}
.odds.sel{background:var(--accent);color:#000;border-color:var(--accent);font-weight:800}
.odds.susp{opacity:.25;text-decoration:line-through;cursor:not-allowed;background:var(--surface-3)}
.odds.chg{background:var(--warn);color:#000;border-color:var(--warn);font-weight:800}

/* Mobile Bottom Nav */
.mobile-tabbar{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--surface);border-top:1px solid var(--border);
  display:flex;z-index:40;
  padding-bottom:env(safe-area-inset-bottom);
}
.mobile-tab{
  flex:1;padding:10px 4px;display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:9px;font-weight:700;
  color:var(--text-2);background:none;border:none;
  transition:color .15s;
}
.mobile-tab.on{color:var(--accent)}

/* Toast */
.toast{
  position:fixed;top:70px;left:50%;transform:translateX(-50%);
  padding:12px 20px;border-radius:10px;font-size:13px;font-weight:700;
  z-index:100;box-shadow:0 12px 32px rgba(0,0,0,0.6);
  animation:slideDown .25s cubic-bezier(0.4,0,0.2,1);
}
@keyframes slideDown{from{top:40px;opacity:0}to{top:70px;opacity:1}}

/* Balance Pill */
.balance-pill{
  background:var(--surface-2);border:1px solid var(--border);
  border-radius:999px;padding:6px 14px;font-size:12px;font-weight:800;
  display:flex;align-items:center;gap:6px;
}
.balance-pill .amt{color:var(--accent);font-variant-numeric:tabular-nums}

/* Slip Item */
.slip-item{border-bottom:1px solid var(--border);padding:12px 0}
.slip-item:last-child{border-bottom:none}
.badge{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:800;letter-spacing:.02em}

/* YAMI İstatistik Paneli (Analytics) */
.stat-bar-container{margin-bottom:14px}
.stat-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-2);font-weight:600;margin-bottom:6px}
.stat-bar{height:6px;background:var(--surface-3);border-radius:3px;overflow:hidden;display:flex}
.stat-bar-home{background:var(--accent);height:100%}
.stat-bar-away{background:var(--text-2);height:100%}
.model-box{background:rgba(0,229,255,0.05);border:1px solid rgba(0,229,255,0.2);border-radius:8px;padding:14px;margin-bottom:10px}
.model-title{font-size:12px;font-weight:800;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.model-val{font-size:13px;font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between}
.model-val span:last-child{color:#fff;font-weight:800}

/* Animations */
.fade-in{animation:fadeIn .25s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.slide-up{animation:slideUp .3s cubic-bezier(0.4,0,0.2,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================
   MOCK VERİ
   ============================================ */
var MOCK_MATCHES = [
  {id:1,sport:"football",league:"Ligue 1",home:"ESTAC Troyes",away:"Le Havre AC",hs:0,as:0,min:-90,live:false,odds:[2.02,3.55,3.45],timeStr:"Nov 20, 22:45",xg:[1.2,0.8]},
  {id:2,sport:"football",league:"UEFA Europa League",home:"Celtic",away:"Besiktas",hs:1,as:1,min:76,live:true,odds:[2.96,3.85,2.16],xg:[1.5,1.1],poss:[48,52],shots:[8,6]},
  {id:3,sport:"football",league:"Premier League",home:"Arsenal",away:"Brighton",hs:2,as:1,min:67,live:true,odds:[2.10,3.40,3.60],xg:[2.1,0.9],poss:[58,42],shots:[12,5]},
  {id:4,sport:"football",league:"LaLiga",home:"Real Madrid",away:"Sevilla",hs:1,as:0,min:54,live:true,odds:[1.35,5.00,8.50],xg:[1.8,0.3],poss:[62,38],shots:[10,3]},
  {id:5,sport:"basketball",league:"NBA",home:"Lakers",away:"Celtics",hs:78,as:82,min:38,live:true,odds:[2.05,1.78]},
  {id:6,sport:"football",league:"Premier League",home:"Liverpool",away:"Everton",hs:0,as:0,min:-90,live:false,odds:[1.45,4.20,6.50],timeStr:"Today 20:00",xg:[1.9,0.7]},
  {id:7,sport:"football",league:"LaLiga",home:"Barcelona",away:"Atletico",hs:0,as:0,min:-180,live:false,odds:[1.95,3.40,3.80],timeStr:"Today 21:30",xg:[1.4,1.2]}
];

var S = {
  route:"home", mid:1, matches:[], loading:true,
  slip:[], stake:10, bets:[],
  follows:[], filter:"all", 
  marketTab:"Markets", matchTab:"Markets", betsTab:"open", // Yami'nin maç detay sekmeleri
  search:"", toast:null, susp:{}, balance:1250.00
};

/* ============================================
   HELPERS
   ============================================ */
function go(r){location.hash="#/"+r}
function byId(id){for(var i=0;i<S.matches.length;i++)if(S.matches[i].id===id)return S.matches[i];return null}
function live(){return S.matches.filter(function(m){return m.live})}
function upcoming(){return S.matches.filter(function(m){return !m.live})}
function potential(){return S.slip.reduce(function(a,s){return s.status==="ok"?a+S.stake*s.od:a},0)}
function slipKey(s){return s.mid+"|"+s.mkt+"|"+s.pick}
function isSusp(k){if(!(k in S.susp))S.susp[k]=Math.random()<0.06;return S.susp[k]}
function clock(m){
  if(m.live){ if(m.sport==="basketball") return "Q"+(Math.floor(m.min/12)+1)+" "+m.min+"'"; return m.min+"'"; }
  return m.timeStr || "Soon";
}
function toast(t,ok){S.toast={t:t,ok:ok};render();setTimeout(function(){S.toast=null;render()},3500)}
function fmt(n){return Number(n).toFixed(2)}
function teamColor(name){var h=0;for(var i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))%360;return "hsl("+h+",45%,30%)"}
function initials(name){var p=name.trim().split(" ");return p.length>1?(p[0][0]+p[1][0]).toUpperCase():name.slice(0,2).toUpperCase()}
function groupByLeague(list){var out=[],seen={};list.forEach(function(m){if(!seen[m.league]){seen[m.league]={league:m.league,ms:[]};out.push(seen[m.league])}seen[m.league].ms.push(m)});return out}

/* ============================================
   SLIP & BETTING
   ============================================ */
function add(m,mkt,pick,od){
  var s={mid:m.id,lbl:m.home+" v "+m.away,mkt:mkt,pick:pick,od:od,status:"ok",old:od};
  var k=slipKey(s);var ex=null;
  for(var i=0;i<S.slip.length;i++)if(slipKey(S.slip[i])===k)ex=S.slip[i];
  if(ex){S.slip=S.slip.filter(function(x){return slipKey(x)!==k});return render()}
  var r=Math.random();
  if(r<0.16){s.status="changed";s.old=od;s.od=+(od+(Math.random()*0.28-0.14)).toFixed(2)}
  else if(r<0.26){s.status="susp"}
  S.slip.push(s);render();
}
function acceptOdds(k){for(var i=0;i<S.slip.length;i++)if(slipKey(S.slip[i])===k)S.slip[i].status="ok";render()}
function removeSel(k){S.slip=S.slip.filter(function(x){return slipKey(x)!==k});render()}
function placeBet(){
  if(!S.slip.length||S.slip.some(function(s){return s.status!=="ok"}))return;
  if(potential()>S.balance){return toast("Insufficient balance",false)}
  if(Math.random()<0.1){S.slip=S.slip.map(function(s){return Object.assign({},s,{status:"susp"})});return toast("Bet failed — market moved.",false)}
  S.slip.forEach(function(s){
    S.bets.unshift({id:Date.now()+Math.random(),lbl:s.lbl,pick:s.pick,mkt:s.mkt,od:s.od,st:S.stake,state:"open",tm:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})})
  });
  S.balance-=S.stake*S.slip.length;
  S.slip=[];go("bets");toast("Bet placed successfully",true);
}

/* ============================================
   UI COMPONENTS
   ============================================ */
function oddsBtn(m,mkt,pick,od,label){
  var k=m.id+"|"+mkt+"|"+pick;var sel=null;
  for(var i=0;i<S.slip.length;i++)if(slipKey(S.slip[i])===k)sel=S.slip[i];
  var cls="odds";
  if(sel)cls+=sel.status==="susp"?" susp":sel.status==="changed"?" chg":" sel";
  if(label) {
      return '<button class="'+cls+'" onclick="event.stopPropagation();add(byId('+m.id+'),\''+mkt+'\',\''+pick+'\','+od+')" style="display:flex;justify-content:space-between;padding:10px 12px"><span style="color:inherit;font-size:12px;opacity:0.8">'+label+'</span><span>'+fmt(od)+'</span></button>';
  }
  return '<button class="'+cls+'" onclick="event.stopPropagation();add(byId('+m.id+'),\''+mkt+'\',\''+pick+'\','+od+')">'+fmt(od)+'</button>';
}
function avatar(name){
  return '<div style="width:28px;height:28px;border-radius:50%;background:'+teamColor(name)+';display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0;border:1px solid rgba(255,255,255,0.08)">'+initials(name)+'</div>';
}
function matchRow(m){
  var three=m.odds.length===3;
  var picks=three?[m.home,"draw",m.away]:[m.home,m.away];
  var labels=three?["1","x","2"]:["1","2"];
  var cols=three?"grid-cols-3":"grid-cols-2";
  
  var h='<div class="match-row fade-in" onclick="go(\'match/'+m.id+'\')">';
  h+='<div class="flex items-center justify-between mb-2 text-[10px]"><div class="flex items-center gap-1.5">';
  if(m.live)h+='<span class="live-dot"></span><span style="color:#ff4444;font-weight:800">LIVE</span><span style="color:#555">·</span>';
  h+='<span style="color:'+(m.live?"#ff4444":"#8b9eb0")+';font-weight:700">'+clock(m)+'</span></div><div style="color:#7a8f9e;font-weight:600">'+m.league+'</div></div>';
  
  h+='<div class="flex items-center gap-3"><div class="flex-1 min-w-0 space-y-1.5">';
  h+='<div class="flex items-center gap-2">'+avatar(m.home)+'<span class="text-[13px] font-semibold truncate flex-1">'+m.home+'</span>'+(m.live?'<span style="color:#00e5ff;font-weight:800">'+m.hs+'</span>':'')+'</div>';
  h+='<div class="flex items-center gap-2">'+avatar(m.away)+'<span class="text-[13px] font-semibold truncate flex-1">'+m.away+'</span>'+(m.live?'<span style="color:#00e5ff;font-weight:800">'+m.as+'</span>':'')+'</div>';
  h+='</div>';
  
  h+='<div style="width:52%;min-width:135px"><div class="odds-labels grid '+cols+' gap-1">';
  labels.forEach(function(l){h+='<span>'+l+'</span>'});
  h+='</div><div class="grid '+cols+' gap-1">';
  for(var i=0;i<(three?3:2);i++)h+='<div>'+oddsBtn(m,"Match Result",picks[i],m.odds[i])+'</div>';
  h+='</div></div></div></div>';
  return h;
}
function leagueBlock(g){
  return '<div class="league-h"><span>'+g.league+'</span><span style="color:#8b9eb0;font-weight:600;font-size:10px;text-transform:none">'+g.ms.length+' '+(g.ms.length===1?'match':'matches')+'</span></div>'+g.ms.map(matchRow).join("");
}
function searchHits(){
  var q=S.search.toLowerCase().trim();if(!q)return"";
  var out="";
  S.matches.forEach(function(m){
    if((m.home+" "+m.away+" "+m.league).toLowerCase().indexOf(q)>=0){
      out+='<div style="padding:10px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid #1c2a36" onclick="go(\'match/'+m.id+'\')">'+m.home+' v '+m.away+' <span style="color:#7a8f9e;font-size:11px">· '+m.league+'</span></div>';
    }
  });
  return out||'<div style="padding:20px;text-align:center;color:#7a8f9e;font-size:13px">No results</div>';
}

/* ============================================
   PAGES
   ============================================ */
function pageHome(){
  var h='<div style="position:relative;margin-bottom:16px">';
  h+='<input value="'+S.search+'" oninput="S.search=this.value;document.getElementById(\'sr\').innerHTML=searchHits();document.getElementById(\'sr\').style.display=this.value?\'block\':\'none\'" placeholder="Search teams, leagues..." style="width:100%;background:#121c24;border:1px solid #1c2a36;border-radius:10px;padding:11px 14px 11px 38px;font-size:13px;color:#fff;outline:none" onfocus="this.style.borderColor=\'#00e5ff\'" onblur="this.style.borderColor=\'#1c2a36\'">';
  h+='<span style="position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#7a8f9e;font-size:14px">🔍</span>';
  h+='<div id="sr" style="display:none;position:absolute;top:100%;left:0;right:0;margin-top:6px;background:#121c24;border:1px solid #1c2a36;border-radius:10px;max-height:280px;overflow:auto;z-index:20;box-shadow:0 16px 40px rgba(0,0,0,0.8)">'+searchHits()+'</div></div>';
  
  h+='<div class="flex gap-2 overflow-x-auto pb-3" style="scrollbar-width:none">';
  h+='<button class="pill '+(S.filter==="all"?"on":"")+'" onclick="S.filter=\'all\';render()">All sports</button>';
  var sports=[...new Set(S.matches.map(function(m){return m.sport}))];
  sports.forEach(function(sp){h+='<button class="pill '+(S.filter===sp?"on":"")+'" onclick="S.filter=\''+sp+'\';render()">'+sp[0].toUpperCase()+sp.slice(1)+'</button>'});
  h+='</div>';

  var liv=live().filter(function(m){return S.filter==="all"||m.sport===S.filter});
  h+='<div class="flex items-center justify-between mb-1 mt-5"><h2 class="text-[14px] font-bold flex items-center gap-2"><span class="live-dot"></span>Live now</h2><span style="color:#7a8f9e;font-size:11px">'+liv.length+' in play</span></div>';
  h+=liv.length?groupByLeague(liv.slice(0,8)).map(leagueBlock).join(""):'<div class="empty"><div class="empty-icon">⏳</div><div class="empty-title">No live matches</div></div>';
  
  var up=upcoming().filter(function(m){return S.filter==="all"||m.sport===S.filter});
  h+='<div class="flex items-center justify-between mb-1 mt-6"><h2 class="text-[14px] font-bold">Starting soon</h2><span style="color:#7a8f9e;font-size:11px">Next up</span></div>';
  h+=up.length?groupByLeague(up.slice(0,6)).map(leagueBlock).join(""):'<div class="empty"><div class="empty-title">Nothing scheduled</div></div>';
  
  return h;
}
function pageLive(){
  var list=live().filter(function(m){return S.filter==="all"||m.sport===S.filter});
  var h='<h1 class="text-xl font-bold mb-1">Live</h1><p style="color:#7a8f9e;font-size:12px;margin:0 0 14px">Every match in play, updated live</p>';
  h+='<div class="flex gap-2 overflow-x-auto pb-3" style="scrollbar-width:none">';
  h+='<button class="pill '+(S.filter==="all"?"on":"")+'" onclick="S.filter=\'all\';render()">All</button>';
  var sports=[...new Set(S.matches.map(function(m){return m.sport}))];
  sports.forEach(function(sp){h+='<button class="pill '+(S.filter===sp?"on":"")+'" onclick="S.filter=\''+sp+'\';render()">'+sp[0].toUpperCase()+sp.slice(1)+'</button>'});
  h+='</div>';
  if(list.length)h+=groupByLeague(list).map(leagueBlock).join("");
  else h+='<div class="card p-8 text-center"><div style="font-size:32px;margin-bottom:8px">⏳</div><div class="font-bold text-sm mb-1">Nothing live right now</div></div>';
  return h;
}
function pageFootball(){
  var leagues=[...new Set(S.matches.filter(function(m){return m.sport==="football"}).map(function(m){return m.league}))];
  var h='<h1 class="text-xl font-bold mb-1">Football</h1><p style="color:#7a8f9e;font-size:12px;margin:0 0 14px">Top five European leagues</p>';
  leagues.forEach(function(lg){
    var ms=S.matches.filter(function(m){return m.league===lg});if(!ms.length)return;
    var f=S.follows.indexOf(lg)>=0;
    h+='<div class="league-h"><span>'+lg+'</span><button class="pill text-[10px] '+(f?"on":"")+'" onclick="event.stopPropagation();(function(){var i=S.follows.indexOf(\''+lg+'\');if(i>=0)S.follows.splice(i,1);else S.follows.push(\''+lg+'\');render()})()" style="padding:3px 10px;font-size:10px">'+(f?"★ Following":"☆ Follow")+'</button></div>';
    h+=ms.map(matchRow).join("");
  });
  return h;
}
function pageMatch(){
  var m=byId(S.mid);if(!m)return'<div class="card p-8 text-center" style="color:#7a8f9e">Match not found</div>';
  var h='<button style="background:none;border:none;color:#7a8f9e;font-size:12px;font-weight:600;cursor:pointer;margin-bottom:12px;padding:0" onclick="go(\'home\')">← Geri Dön</button>';
  
  // Skorboard
  h+='<div class="card p-5 mb-4"><div class="flex justify-between text-[10px] mb-3"><span style="color:#a09cb8">'+m.league+'</span><span style="color:'+(m.live?"#ff4444":"#a09cb8")+';font-weight:800">'+(m.live?"● LIVE · "+clock(m):clock(m))+'</span></div>';
  h+='<div class="flex items-center justify-between gap-4"><div style="text-align:center;flex:1"><div style="margin:0 auto 6px">'+avatar(m.home).replace("width:28px;height:28px","width:52px;height:52px;font-size:16px")+'</div><div class="text-[14px] font-bold">'+m.home+'</div></div>';
  h+='<div style="text-align:center"><div style="font-size:36px;font-weight:900;color:#00e5ff;line-height:1;font-variant-numeric:tabular-nums">'+m.hs+'</div><div style="font-size:36px;font-weight:900;color:#00e5ff;line-height:1;font-variant-numeric:tabular-nums">'+m.as+'</div></div>';

setInterval(function(){
  var updated=false;
  S.matches.forEach(function(m){
    if(m.live && !m.paused){
      m.min++;
      updated=true;
      if(m.sport==="football" && m.min > 90){ m.live = false; m.min = 90; }
      if(m.sport==="football" && m.min < 90 && Math.random() < 0.02){
        if(Math.random() < 0.5) m.hs++; else m.as++;
        m.justScored = true;
        setTimeout(function(){ m.justScored = false; render(); }, 2500);
        for(var key in S.susp) { if(key.indexOf(m.id+"|") === 0) S.susp[key] = true; }
        setTimeout(function(){
           for(var key in S.susp) { if(key.indexOf(m.id+"|") === 0) delete S.susp[key]; }
           render();
        }, 4000);
      }
    }
  });
  if(S.route==="match"){
    var currentM=byId(S.mid);
    if(currentM && currentM.live){
       currentM.odds=currentM.odds.map(function(o){
         if(Math.random()<0.2) return Math.max(1.01, +(o + (Math.random()*0.1-0.05)).toFixed(2));
         return o;
       });
       S.slip.forEach(function(s){
         if(s.mid===currentM.id && s.status==="ok" && Math.random()<0.1){
            s.status="changed"; s.old=s.od; s.od=+(s.od+(Math.random()*0.2-0.1)).toFixed(2);
         }
       });
       updated=true;
    }
  }
  if(updated && (S.route==="match"||S.route==="home"||S.route==="live")){
    if(document.activeElement.tagName!=="INPUT") render();
  }
}, 5000);

/* ============================================
   INIT
   ============================================ */
norm();
S.matches = MOCK_MATCHES;
S.loading = false;
render();
</script>
