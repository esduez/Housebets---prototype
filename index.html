<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Housebets</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#0a0e13;color:#e8eef7;font-family:system-ui,sans-serif;margin:0}
.c{background:#111823;border:1px solid #1d2734;border-radius:14px}
.o{background:#182231;border:1px solid #22303f;border-radius:9px;padding:9px 4px;text-align:center;cursor:pointer;width:100%;font-size:13px;color:#e8eef7;font-variant-numeric:tabular-nums}
.o.sel{background:#c8ff3d;color:#0a0e13;border-color:#c8ff3d;font-weight:700}
.o.susp{opacity:.3;text-decoration:line-through;cursor:not-allowed}
.o.chg{background:#f5b544;color:#0a0e13;border-color:#f5b544;font-weight:700}
.p{background:#182231;border:1px solid #22303f;border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;white-space:nowrap;color:#e8eef7}
.p.on{background:#c8ff3d;color:#0a0e13;border-color:#c8ff3d;font-weight:600}
.n{padding:9px 12px;border-radius:9px;cursor:pointer;color:#8a96a8;font-size:14px;background:none;border:none;width:100%;text-align:left}
.n.on{background:#182231;color:#c8ff3d;font-weight:600}
.lm{color:#c8ff3d;font-weight:bold}
.mut{color:#8a96a8}
.mut{color:#8a96a8}
</style>
</head>
<body>
<div id="app"></div>
<script>
var SPORTS=[["Football","football"],["Basketball","basketball"],["Tennis","tennis"],["Hockey","hockey"],["MMA","mma"]];
var LEAGUES=["Premier League","Champions League","LaLiga","Serie A","Bundesliga"];
var M=[
{id:1,sp:"football",lg:"Premier League",h:"Arsenal",a:"Brighton",hs:2,as:1,mn:67,lv:1,o:[2.10,3.40,3.60]},
{id:2,sp:"football",lg:"Premier League",h:"Chelsea",a:"Newcastle",hs:0,as:0,mn:31,lv:1,o:[2.45,3.20,2.90]},
{id:3,sp:"football",lg:"LaLiga",h:"Real Madrid",a:"Sevilla",hs:1,as:0,mn:54,lv:1,o:[1.35,5.00,8.50]},
{id:4,sp:"football",lg:"Serie A",h:"Inter",a:"Roma",hs:2,as:2,mn:78,lv:1,o:[1.90,3.60,3.90]},
{id:5,sp:"football",lg:"Bundesliga",h:"Bayern",a:"Dortmund",hs:1,as:1,mn:45,lv:1,o:[1.70,4.00,4.20]},
{id:6,sp:"football",lg:"Champions League",h:"Man City",a:"PSG",hs:0,as:0,mn:12,lv:1,o:[1.85,3.80,4.00]},
{id:7,sp:"basketball",lg:"NBA",h:"Lakers",a:"Celtics",hs:78,as:82,mn:38,lv:1,o:[2.05,1.78]},
{id:8,sp:"tennis",lg:"ATP",h:"Alcaraz",a:"Sinner",hs:1,as:1,mn:0,lv:1,o:[1.65,2.20]},
{id:9,sp:"football",lg:"Premier League",h:"Liverpool",a:"Everton",hs:0,as:0,mn:-90,lv:0,o:[1.45,4.20,6.50]},
{id:10,sp:"football",lg:"LaLiga",h:"Barcelona",a:"Atletico",hs:0,as:0,mn:-180,lv:0,o:[1.95,3.40,3.80]},
{id:11,sp:"football",lg:"Champions League",h:"Bayern",a:"Real Madrid",hs:0,as:0,mn:-1440,lv:0,o:[2.30,3.50,2.90]},
{id:12,sp:"basketball",lg:"NBA",h:"Warriors",a:"Suns",hs:0,as:0,mn:-300,lv:0,o:[1.90,1.90]}
];
var TABS=["Popular","Goals","Halves","Handicaps","Goalscorers","Corners"];
var MKT={
Popular:[["Match Result",["Home","Draw","Away"],[2.10,3.40,3.60]],["BTTS",["Yes","No"],[1.72,2.05]],["Total 2.5",["Over","Under"],[1.88,1.92]]],
Goals:[["Total 1.5",["Over","Under"],[1.30,3.40]],["Total 3.5",["Over","Under"],[2.60,1.48]],["Home 1.5",["Over","Under"],[1.95,1.80]]],
Halves:[["1st Half",["Home","Draw","Away"],[2.60,2.10,4.20]],["2nd Half",["Home","Draw","Away"],[2.20,2.40,4.60]]],
Handicaps:[["Home -1",["Home","Away"],[1.95,1.85]],["Away +1",["Home","Away"],[1.70,2.10]],["Asian 0.5",["Home","Away"],[1.88,1.92]]],
Goalscorers:[["Saka",["Yes","No"],[2.30,1.55]],["Havertz",["Yes","No"],[2.60,1.45]],["Mitoma",["Yes","No"],[3.40,1.28]]],
Corners:[["Total 9.5",["Over","Under"],[1.85,1.90]],["Home Most",["Yes","No"],[1.75,2.00]],["Card",["Yes","No"],[1.40,2.70]]]
};
var S={route:"home",mid:1,slip:[],stake:10,bets:[{id:1,lbl:"Liverpool v Everton",pick:"Liverpool",mkt:"Match Result",od:1.45,st:25,state:"settled",tm:"Yesterday"}],foll:[],lf:"all",tab:"Popular",btab:"open",srch:"",toast:null,susp:{}};
function go(r){location.hash="#/"+r}
function byId(i){for(var x=0;x<M.length;x++)if(M[x].id===i)return M[x];return null}
function live(){return M.filter(function(m){return m.lv})}
function soon(){return M.filter(function(m){return !m.lv})}
function pot(){return S.slip.reduce(function(a,s){return s.status==="ok"?a+S.stake*s.od:a},0)}
function key(s){return s.mid+"|"+s.mkt+"|"+s.pick}
function isS(k){if(!(k in S.susp))S.susp[k]=Math.random()<0.06;return S.susp[k]}
function clk(m){if(m.lv)return m.mn+"'";if(m.mn===-90)return "Today 20:00";if(m.mn===-180)return "Today 21:30";if(m.mn===-1440)return "Tomorrow 20:00";if(m.mn===-300)return "Tomorrow 02:00";return "Soon"}
function toast(t,ok){S.toast={t:t,ok:ok};render();setTimeout(function(){S.toast=null;render()},3000)}

function add(m,mkt,pick,od){
var s={mid:m.id,lbl:m.h+" v "+m.a,mkt:mkt,pick:pick,od:od,status:"ok",old:od};
var k=key(s);var ex=null;for(var i=0;i<S.slip.length;i++)if(key(S.slip[i])===k)ex=S.slip[i];
if(ex){S.slip=S.slip.filter(function(x){return key(x)!==k});return render()}
var r=Math.random();
if(r<0.16){s.status="changed";s.old=od;s.od=+(od+(Math.random()*0.28-0.14)).toFixed(2)}
else if(r<0.26){s.status="susp"}
S.slip.push(s);render();
}
function acc(k){for(var i=0;i<S.slip.length;i++)if(key(S.slip[i])===k)S.slip[i].status="ok";render()}
function rem(k){S.slip=S.slip.filter(function(x){return key(x)!==k});render()}
function place(){
if(!S.slip.length||S.slip.some(function(s){return s.status!=="ok"}))return;
if(Math.random()<0.1){S.slip.forEach(function(s){s.status="susp"});return toast("Bet failed - market moved",false)}
S.slip.forEach(function(s){S.bets.unshift({id:Date.now()+Math.random(),lbl:s.lbl,pick:s.pick,mkt:s.mkt,od:s.od,st:S.stake,state:"open",tm:new Date().toLocaleTimeString()})});
S.slip=[];go("bets");toast("Bet placed successfully",true);
}

function oddBtn(m,mkt,pick,od){
var k=m.id+"|"+mkt+"|"+pick;var sel=null;
for(var i=0;i<S.slip.length;i++)if(key(S.slip[i])===k)sel=S.slip[i];
var cls="o";
if(sel)cls+=(sel.status==="susp"?" susp":sel.status==="changed"?" chg":" sel");
return '<button class="'+cls+'" onclick="event.stopPropagation();add(byId('+m.id+'),\''+mkt+'\',\''+pick+'\','+od+')">'+od.toFixed(2)+'</button>';
}

function row(m){
var three=m.o.length===3;
var picks=three?[m.h,"Draw",m.a]:[m.h,m.a];
var g=three?"grid-cols-3":"grid-cols-2";
var h='<div class="c p-3 mb-2 cursor-pointer" onclick="go(\'match/'+m.id+'\')">';
h+='<div class="flex justify-between items-center mb-2 text-[11px]"><div class="mut">'+m.lg+'</div><div class="'+(m.lv?"lm":"mut")+'">'+(m.lv?"LIVE ":"")+clk(m)+'</div></div>';
h+='<div class="flex items-center gap-3"><div class="flex-1 min-w-0"><div class="font-semibold text-sm truncate">'+m.h+'</div><div class="font-semibold text-sm truncate">'+m.a+'</div></div>';
if(m.lv)h+='<div class="text-right"><div class="lm font-bold text-base">'+m.hs+'</div><div class="lm font-bold text-base">'+m.as+'</div></div>';
h+='<div class="grid '+g+' gap-1.5" style="width:58%">';
for(var i=0;i<m.o.length;i++)h+='<div>'+oddBtn(m,"Match Result",picks[i],m.o[i])+'</div>';
h+='</div></div></div>';
return h;
}

function home(){
var h='<div class="mb-4"><input value="'+S.srch+'" oninput="S.srch=this.value;document.getElementById(\'hits\').innerHTML=hits()" placeholder="Search teams, players, competitions, markets" class="w-full c px-4 py-3 text-sm outline-none" style="background:#111823;border:1px solid #1d2734"/><div id="hits" class="c mt-2 max-h-64 overflow-auto">'+(S.srch?hits():"")+'</div></div>';
h+='<div class="flex gap-2 overflow-x-auto pb-3">';
for(var i=0;i<SPORTS.length;i++)h+='<button class="p '+(S.lf===SPORTS[i][1]?"on":"")+'" onclick="S.lf=\''+SPORTS[i][1]+'\';render()">'+SPORTS[i][0]+'</button>';
h+='</div>';
h+='<h2 class="text-lg font-bold mt-5 mb-2">Live now</h2>';
h+=live().slice(0,6).map(row).join("");
h+='<h2 class="text-lg font-bold mt-6 mb-2">Starting soon</h2>';
h+=soon().slice(0,4).map(row).join("");
h+='<h2 class="text-lg font-bold mt-6 mb-2">Top competitions</h2>';
h+='<div class="grid grid-cols-2 gap-2">';
for(var j=0;j<LEAGUES.length;j++){
var cnt=M.filter(function(x){return x.lg===LEAGUES[j]}).length;
h+='<div class="c p-3" onclick="go(\'football\')"><div class="font-semibold text-sm">'+LEAGUES[j]+'</div><div class="mut text-xs mt-1">'+cnt+' matches</div></div>';
}
h+='</div>';
return h;
}

function hits(){
var q=S.srch.toLowerCase().trim();if(!q)return"";
var out="";
M.forEach(function(m){if((m.h+" "+m.a+" "+m.lg).toLowerCase().indexOf(q)>=0)out+='<div class="px-3 py-2 cursor-pointer text-sm" onclick="go(\'match/'+m.id+'\')">'+m.h+' v '+m.a+' <span class="mut text-xs">- '+m.lg+'</span></div>'});
LEAGUES.forEach(function(l){if(l.toLowerCase().indexOf(q)>=0)out+='<div class="px-3 py-2 cursor-pointer text-sm" onclick="go(\'football\')">'+l+' <span class="mut text-xs">- Competition</span></div>'});
return out||'<div class="p-4 mut text-sm text-center">No results</div>';
}

function livePage(){
var list=live().filter(function(m){return S.lf==="all"||m.sp===S.lf});
var h='<h1 class="text-2xl font-bold mb-1">Live</h1><p class="mut text-sm mb-4">Every match in play</p>';
h+='<div class="flex gap-2 overflow-x-auto pb-3"><button class="p '+(S.lf==="all"?"on":"")+'" onclick="S.lf=\'all\';render()">All</button>';
for(var i=0;i<SPORTS.length;i++)h+='<button class="p '+(S.lf===SPORTS[i][1]?"on":"")+'" onclick="S.lf=\''+SPORTS[i][1]+'\';render()">'+SPORTS[i][0]+'</button>';
h+='</div>';
if(list.length)h+=list.map(row).join("");
else h+='<div class="c p-8 text-center mt-4"><div class="text-3xl mb-2">...</div><div class="font-semibold mb-1">Nothing live right now</div><div class="mut text-sm mb-4">Starting soon</div>'+soon().slice(0,3).map(row).join("")+'</div>';
return h;
}

function fb(){
var h='<h1 class="text-2xl font-bold mb-1">Football</h1><p class="mut text-sm mb-4">Top five leagues</p>';
LEAGUES.forEach(function(lg){
var ms=M.filter(function(m){return m.lg===lg});if(!ms.length)return;
var f=S.foll.indexOf(lg)>=0;
h+='<div class="mb-5"><div class="flex justify-between items-center mb-2"><h2 class="font-bold">'+lg+'</h2>';
h+='<button class="p '+(f?"on":"")+'" onclick="(function(){var i=S.foll.indexOf(\''+lg+'\');if(i>=0)S.foll.splice(i,1);else S.foll.push(\''+lg+'\');render()})()">'+(f?"Following":"Follow")+'</button></div>';
h+=ms.map(row).join("")+'</div>';
});
return h;
}

function match(){
var m=byId(S.mid);if(!m)return"<div>Not found</div>";
var h='<button class="mut text-sm mb-3" onclick="go(\'home\')">Back</button>';
h+='<div class="c p-4 mb-4"><div class="flex justify-between text-xs mut mb-2"><span>'+m.lg+'</span><span class="'+(m.lv?"lm":"")+'">'+(m.lv?"LIVE ":"")+clk(m)+'</span></div>';
h+='<div class="flex items-center justify-between gap-4"><div><div class="font-bold text-lg">'+m.h+'</div><div class="font-bold text-lg">'+m.a+'</div></div>';
h+='<div class="text-right"><div class="lm text-3xl font-black">'+m.hs+'</div><div class="lm text-3xl font-black">'+m.as+'</div></div></div></div>';
h+='<div class="flex gap-2 overflow-x-auto pb-3 mb-2">';
for(var i=0;i<TABS.length;i++)h+='<button class="p '+(S.tab===TABS[i]?"on":"")+'" onclick="S.tab=\''+TABS[i]+'\';render()">'+TABS[i]+'</button>';
h+='</div>';
var groups=MKT[S.tab]||[];
if(S.tab==="Popular"&&m.o.length===3)groups=groups.map(function(g){return g[0]==="Match Result"?["Match Result",[m.h,"Draw",m.a],m.o]:g});
groups.forEach(function(g){
var k=m.id+"|"+S.tab+"|"+g[0];var su=isS(k);
var gclass=g[1].length===3?"grid-cols-3":"grid-cols-2";
h+='<div class="c p-3 mb-2"><div class="flex justify-between items-center mb-2"><div class="font-semibold text-sm">'+g[0]+'</div>'+(su?'<span class="text-xs" style="color:#f87171">SUSPENDED</span>':'')+'</div>';
h+='<div class="grid '+gclass+' gap-1.5">';
for(var j=0;j<g[1].length;j++){
h+='<div><div class="mut text-xs mb-1 text-center truncate">'+g[1][j]+'</div>';
h+=su?'<button class="o susp">'+g[2][j].toFixed(2)+'</button>':oddBtn(m,g[0],g[1][j],g[2][j]);
h+='</div>';
}
h+='</div></div>';
});
return h;
}

function slipLine(s){
var k=key(s);var badge="";
if(s.status==="susp")badge='<span class="text-xs" style="color:#f87171">SUSPENDED</span>';
if(s.status==="changed")badge='<span class="text-xs" style="color:#f5b544">ODDS MOVED</span>';
var h='<div style="border-bottom:1px solid #1d2734;padding:10px 0">';
h+='<div class="flex justify-between gap-2"><div class="flex-1 min-w-0"><div class="mut text-xs truncate">'+s.lbl+'</div><div class="text-sm font-semibold truncate">'+s.pick+'</div><div class="mut text-xs">'+s.mkt+' '+badge+'</div></div>';
h+='<div class="text-right"><div class="font-bold text-sm">'+s.od.toFixed(2)+'</div>'+(s.status==="changed"?'<div class="mut text-xs" style="text-decoration:line-through">'+s.old.toFixed(2)+'</div>':'')+'<button class="mut text-xs" onclick="rem(\''+k+'\')">Remove</button></div></div>';
if(s.status==="changed")h+='<button class="w-full text-xs py-1.5 mt-1 rounded" style="background:rgba(245,181,68,0.2);color:#f5b544" onclick="acc(\''+k+'\')">Accept new odds '+s.od.toFixed(2)+'</button>';
h+='</div>';
return h;
}

function slipBody(){
if(!S.slip.length)return'<div class="text-center py-8 mut text-sm">Slip empty. Tap odds to add a single.</div>';
var bad=S.slip.some(function(s){return s.status!=="ok"});
var h='<div>'+S.slip.map(slipLine).join("")+'</div>';
h+='<div class="p-3 rounded mt-3" style="background:#0a0e13"><div class="flex justify-between mut text-xs mb-1"><span>Stake (USDT)</span><span>Singles only</span></div>';
h+='<input type="number" value="'+S.stake+'" oninput="S.stake=+this.value||0;render()" class="w-full px-3 py-2 text-sm rounded" style="background:#111823;border:1px solid #1d2734;color:#e8eef7"/>';
h+='<div class="flex justify-between mt-2 text-sm"><span class="mut">Potential return</span><span class="lm font-bold">'+pot().toFixed(2)+' USDT</span></div>';
h+='<button '+(bad?"disabled":"")+' onclick="place()" class="w-full mt-3 py-2.5 rounded font-bold text-sm" style="'+(bad?"background:#1d2734;color:#8a96a8":"background:#c8ff3d;color:#0a0e13")+'">'+(bad?"Resolve selections first":"Place bet")+'</button></div>';
return h;
}

function betsPage(){
var list=S.bets.filter(function(b){return S.btab==="open"?b.state==="open":b.state!=="open"});
var h='<h1 class="text-2xl font-bold mb-4">Bet slip and My bets</h1><div class="grid grid-cols-1 md:grid-cols-2 gap-4">';
h+='<div class="c p-4"><h2 class="font-bold mb-3">Bet slip</h2>'+slipBody()+'</div>';
h+='<div class="c p-4"><div class="flex justify-between items-center mb-3"><h2 class="font-bold">My bets</h2><div class="flex gap-1">';
h+='<button class="p text-xs '+(S.btab==="open"?"on":"")+'" onclick="S.btab=\'open\';render()">Open</button>';
h+='<button class="p text-xs '+(S.btab==="settled"?"on":"")+'" onclick="S.btab=\'settled\';render()">Settled</button></div></div>';
if(list.length)h+=list.map(function(b){return '<div style="border-bottom:1px solid #1d2734;padding:10px 0"><div class="flex justify-between mut text-xs mb-1"><span>'+b.tm+' - Single</span><span style="color:'+(b.state==="open"?"#c8ff3d":"#8a96a8")+'">'+b.state.toUpperCase()+'</span></div><div class="mut text-xs">'+b.lbl+'</div><div class="text-sm flex justify-between"><span>'+b.pick+'</span><span class="font-bold">'+b.od.toFixed(2)+'</span></div><div class="flex justify-between text-xs mt-1"><span class="mut">Stake '+b.st+' USDT</span><span class="lm">Return '+(b.st*b.od).toFixed(2)+' USDT</span></div></div>'}).join("");
else h+='<div class="text-center py-8 mut text-sm">No bets</div>';
h+='</div></div></div>';
return h;
}

var NAV=[["home","Sports"],["live","Live"],["football","Football"],["bets","Bet slip and My bets"]];

function shell(html){
var h='<header style="background:#0a0e13;border-bottom:1px solid #1d2734;position:sticky;top:0;z-index:30;padding:0 12px;height:56px;display:flex;align-items:center;gap:12px">';
h+='<button class="mut text-xl lg:hidden" onclick="document.getElementById(\'dr\').style.display=document.getElementById(\'dr\').style.display===\'none\'?\'block\':\'none\'">=</button>';
h+='<div class="font-black text-lg cursor-pointer" onclick="go(\'home\')">HOUSE<span class="lm">BETS</span></div>';
h+='<nav class="hidden lg:flex gap-1 ml-4">';
NAV.forEach(function(n){h+='<button class="n '+(S.route===n[0]?"on":"")+'" onclick="go(\''+n[0]+'\')">'+n[1]+'</button>'});
h+='</nav><div style="flex:1"></div><span class="mut text-xs hidden sm:inline">18+ Demo</span><span class="p on text-xs">USDT</span></header>';
h+='<div style="max-width:1440px;margin:0 auto;display:flex">';
h+='<aside id="dr" class="hidden lg:block" style="width:200px;border-right:1px solid #1d2734;min-height:calc(100vh - 56px);padding:8px;flex-shrink:0">';
NAV.forEach(function(n){h+='<button class="n '+(S.route===n[0]?"on":"")+'" onclick="go(\''+n[0]+'\')">'+n[1]+'</button>'});
h+='</aside>';
h+='<main style="flex:1;min-width:0;padding:16px;padding-bottom:'+(S.slip.length&&S.route!=="bets"?"100px":"24px")+'"><div style="max-width:720px">'+html+'</div></main>';
if(S.route!=="bets")h+='<aside class="hidden xl:block" style="width:320px;border-left:1px solid #1d2734;padding:12px;min-height:calc(100vh - 56px);flex-shrink:0"><div class="c p-3"><h3 class="font-bold text-sm mb-2">Bet slip ('+S.slip.length+')</h3>'+slipBody()+'</div></aside>';
h+='</div>';
if(S.slip.length&&S.route!=="bets")h+='<div class="xl:hidden" style="position:fixed;bottom:0;left:0;right:0;background:#111823;border-top:2px solid #c8ff3d;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:40;cursor:pointer" onclick="go(\'bets\')"><div><div class="mut text-xs">Slip: '+S.slip.length+' singles</div><div class="lm font-bold">'+pot().toFixed(2)+' USDT</div></div><button style="background:#c8ff3d;color:#0a0e13;font-weight:bold;border:none;padding:8px 16px;border-radius:8px;cursor:pointer">Open</button></div>';
if(S.toast)h+='<div style="position:fixed;top:80px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:8px;font-size:13px;font-weight:500;z-index:50;background:'+(S.toast.ok?"#c8ff3d;color:#0a0e13":"#ef4444;color:white")+'">'+S.toast.t+'</div>';
h+='<footer style="text-align:center;font-size:10px;color:#8a96a8;padding:24px 16px">18+ - Gamble responsibly - Demo data only - No real money</footer>';
return h;
}

function norm(){var h=location.hash.replace("#/","").split("/");S.route=h[0]||"home";if(h[0]==="match"&&h[1])S.mid=+h[1]}

function render(){
var pages={home:home,live:livePage,football:fb,match:match,bets:betsPage};
document.getElementById("app").innerHTML=shell((pages[S.route]||home)());
}

window.addEventListener("hashchange",function(){norm();render()});

setInterval(function(){
if(S.route!=="match")return;var m=byId(S.mid);if(!m)return;
var groups=MKT[S.tab]||[];var changed=false;
