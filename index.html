<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Housebets Sportsbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--bg:#0b0e14;--surface:#12161f;--surface-2:#1a2030;--surface-3:#232b3d;--border:#2a3348;--text:#e8edf5;--text-2:#8b98ad;--accent:#00e676;--accent-2:#00c853;--live:#ff5252;--warn:#ffb300;--radius:10px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-feature-settings:'tnum';-webkit-font-smoothing:antialiased}
button{font-family:inherit}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.odds{background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:9px 4px;width:100%;cursor:pointer;text-align:center;font-weight:700;font-size:13px;color:var(--text);font-variant-numeric:tabular-nums;transition:all .15s}
.odds:hover{border-color:var(--accent);color:var(--accent)}
.odds.sel{background:var(--accent);color:#0b0e14;border-color:var(--accent)}
.odds.susp{opacity:.3;text-decoration:line-through;cursor:not-allowed}
.odds.chg{background:var(--warn);color:#0b0e14;border-color:var(--warn)}
.pill{background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--text-2);transition:all .15s}
.pill:hover{border-color:var(--accent);color:var(--text)}
.pill.on{background:var(--accent);color:#0b0e14;border-color:var(--accent)}
.nav{padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--text-2);font-size:13px;font-weight:600;background:none;border:none;width:100%;text-align:left;transition:all .12s;display:flex;align-items:center;gap:10px}
.nav:hover{background:var(--surface-2);color:var(--text)}
.nav.on{background:rgba(0,230,118,.1);color:var(--accent)}
.match-row{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:6px;cursor:pointer;transition:all .15s}
.match-row:hover{border-color:var(--accent);background:var(--surface-2)}
.league-h{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--surface-2);border-left:3px solid var(--accent);border-radius:6px;margin:12px 0 4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--live);display:inline-block;animation:lp 1.4s infinite}
@keyframes lp{0%,100%{opacity:1}50%{opacity:.3}}
.odds-labels{display:grid;gap:3px;font-size:9px;color:var(--text-2);text-align:center;margin-bottom:3px;font-weight:700}
.mobile-tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.mobile-tab{flex:1;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;font-weight:600;color:var(--text-2);background:none;border:none;cursor:pointer}
.mobile-tab.on{color:var(--accent)}
.mobile-tab-icon{font-size:17px;line-height:1}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.balance-pill{background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.balance-pill .amt{color:var(--accent);font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:32px 16px;color:var(--text-2)}
.empty .icon{font-size:28px;margin-bottom:8px;opacity:.5}
.empty .title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px}
.slip-item{border-bottom:1px solid var(--border);padding:10px 0}
.slip-item:last-child{border-bottom:none}
.badge{font-size:9px;padding:2px 5px;border-radius:4px;font-weight:700}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.page-in{animation:fadeIn .2s ease}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =========================================================
   CONFIG — Bet Better API (Ücretsiz, kayıt yok, anahtar yok)
   ========================================================= */
const CONFIG = {
  mode: "live", // "live" = Bet Better API, "mock" = örnek veri
  baseUrl: "https://betbetter.world",
  leagues: ["soccer/epl", "soccer/la-liga", "soccer/serie-a", "soccer/bundesliga", "soccer/ligue-1", "nba"],
  leagueNames: {
    "soccer/epl": "Premier League",
    "soccer/la-liga": "LaLiga",
    "soccer/serie-a": "Serie A",
    "soccer/bundesliga": "Bundesliga",
    "soccer/ligue-1": "Ligue 1",
    "nba": "NBA"
  },
  // CORS hatası alırsan bu satırı aç (başındaki //'yi kaldır):
  // proxyUrl: "https://corsproxy.io/?"
  proxyUrl: ""
};

/* =========================================================
   MOCK VERİ (API çalışmazsa)
   ========================================================= */
const MOCK_MATCHES = [
  {id:1,sport:"football",league:"Premier League",home:"Arsenal",away:"Brighton",hs:2,as:1,min:67,live:true,odds:[2.10,3.40,3.60]},
  {id:2,sport:"football",league:"Premier League",home:"Chelsea",away:"Newcastle",hs:0,as:0,min:31,live:true,odds:[2.45,3.20,2.90]},
  {id:3,sport:"football",league:"LaLiga",home:"Real Madrid",away:"Sevilla",hs:1,as:0,min:54,live:true,odds:[1.35,5.00,8.50]},
  {id:4,sport:"football",league:"Serie A",home:"Inter",away:"Roma",hs:2,as:2,min:78,live:true,odds:[1.90,3.60,3.90]},
  {id:5,sport:"basketball",league:"NBA",home:"Lakers",away:"Celtics",hs:78,as:82,min:38,live:true,odds:[2.05,1.78]},
  {id:6,sport:"football",league:"Premier League",home:"Liverpool",away:"Everton",hs:0,as:0,min:-90,live:false,odds:[1.45,4.20,6.50]},
  {id:7,sport:"football",league:"LaLiga",home:"Barcelona",away:"Atletico",hs:0,as:0,min:-180,live:false,odds:[1.95,3.40,3.80]}
];

/* =========================================================
   API KATMANI — Bet Better
   ========================================================= */
const API = {
  async fetchMatches() {
    if (CONFIG.mode === "mock") return MOCK_MATCHES.map(m => ({...m, _raw: null}));
    try {
      const results = await Promise.all(
        CONFIG.leagues.map(lg => this.fetchLeague(lg))
      );
      const all = results.flat();
      if (!all.length) throw new Error("Empty API response");
      return all;
    } catch (e) {
      console.warn("Bet Better API hatası, mock'a dönülüyor:", e);
      return MOCK_MATCHES.map(m => ({...m, _raw: null}));
    }
  },

  async fetchLeague(league) {
    const url = (CONFIG.proxyUrl || "") + CONFIG.baseUrl + "/" + league + "/picks?format=json";
    const res = await fetch(url, { headers: { "Accept": "application/json" } });
    if (!res.ok) throw new Error(league + " → HTTP " + res.status);
    const data = await res.json();
    return this.normalizeLeague(data, league);
  },

  normalizeLeague(data, leaguePath) {
    const picks = data.picks || [];
    const leagueName = CONFIG.leagueNames[leaguePath] || leaguePath;
    const sport = leaguePath.startsWith("soccer") ? "football" : leaguePath === "nba" ? "basketball" : "other";
    const matchesMap = {};
    let counter = 1;

    picks.forEach(p => {
      if (!p.game) return;
      const parts = p.game.split(" vs ");
      if (parts.length !== 2) return;
      const home = parts[0].trim();
      const away = parts[1].trim();
      const key = home + "|" + away;

      if (!matchesMap[key]) {
        matchesMap[key] = {
          id: (leaguePath + counter++).hashCode ? (leaguePath + counter).hashCode() : counter,
          sport,
          league: leagueName,
          home,
          away,
          hs: 0, as: 0,
          min: -90,
          live: false,
          odds: [2.00, 3.50, 3.00],
          _raw: p
        };
      }

      // Moneyline / Match Result oranlarını yakala
      const mkt = (p.market || "").toLowerCase();
      if ((mkt.includes("moneyline") || mkt.includes("match result") || mkt.includes("1x2")) && p.fairOdds) {
        if (p.selection === home) matchesMap[key].odds[0] = p.fairOdds;
        else if (p.selection === away) matchesMap[key].odds[2] = p.fairOdds;
        else if (mkt.includes("draw") || p.selection === "Draw") matchesMap[key].odds[1] = p.fairOdds;
      }
    });

    return Object.values(matchesMap);
  }
};

// Basit string hash (id çakışmasını önlemek için)
String.prototype.hashCode = function() {
  let h = 0;
  for (let i = 0; i < this.length; i++) h = ((h << 5) - h + this.charCodeAt(i)) | 0;
  return Math.abs(h);
};

/* =========================================================
   STATE
   ========================================================= */
const S = {
  route: "home", mid: 1, matches: [], slip: [], stake: 10,
  bets: [{id:1,lbl:"Liverpool v Everton",pick:"Liverpool",mkt:"Match Result",od:1.45,st:25,state:"settled",tm:"Yesterday"}],
  follows: [], filter: "all", marketTab: "Popular", betsTab: "open",
  search: "", toast: null, susp: {}, balance: 1250.00, loading: true
};

/* =========================================================
   HELPERS
   ========================================================= */
function go(r){location.hash="#/"+r}
function byId(id){return S.matches.find(m=>m.id===id)}
function live(){return S.matches.filter(m=>m.live)}
function upcoming(){return S.matches.filter(m=>!m.live)}
function potential(){return S.slip.reduce((a,s)=>s.status==="ok"?a+S.stake*s.od:a,0)}
function slipKey(s){return s.mid+"|"+s.mkt+"|"+s.pick}
function isSusp(k){if(!(k in S.susp))S.susp[k]=Math.random()<0.06;return S.susp[k]}
function clock(m){if(m.live)return m.min+"'";if(m.min===-90)return "Upcoming";return "Soon"}
function toast(t,ok){S.toast={t,ok};render();setTimeout(()=>{S.toast=null;render()},3200)}
function fmt(n){return Number(n).toFixed(2)}
function teamColor(name){let h=0;for(let i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))%360;return `hsl(${h},40%,28%)`}
function initials(name){const p=name.trim().split(" ");return p.length>1?(p[0][0]+p[1][0]).toUpperCase():name.slice(0,2).toUpperCase()}
function groupByLeague(list){const out=[],seen={};list.forEach(m=>{if(!seen[m.league]){seen[m.league]={league:m.league,ms:[]};out.push(seen[m.league])}seen[m.league].ms.push(m)});return out}

/* =========================================================
   SLIP MANTIĞI
   ========================================================= */
function add(m,mkt,pick,od){
  const s={mid:m.id,lbl:m.home+" v "+m.away,mkt,pick,od,status:"ok",old:od};
  const k=slipKey(s);const ex=S.slip.find(x=>slipKey(x)===k);
  if(ex){S.slip=S.slip.filter(x=>slipKey(x)!==k);return render()}
  const r=Math.random();
  if(r<0.16){s.status="changed";s.old=od;s.od=+(od+(Math.random()*0.28-0.14)).toFixed(2)}
  else if(r<0.26){s.status="susp"}
  S.slip.push(s);render();
}
function acceptOdds(k){const s=S.slip.find(x=>slipKey(x)===k);if(s)s.status="ok";render()}
function removeSel(k){S.slip=S.slip.filter(x=>slipKey(x)!==k);render()}
function placeBet(){
  if(!S.slip.length||S.slip.some(s=>s.status!=="ok"))return;
  if(potential()>S.balance)return toast("Insufficient balance",false);
  if(Math.random()<0.1){S.slip=S.slip.map(s=>({...s,status:"susp"}));return toast("Bet failed — a market moved",false)}
  S.slip.forEach(s=>{
    S.bets.unshift({id:Date.now()+Math.random(),lbl:s.lbl,pick:s.pick,mkt:s.mkt,od:s.od,st:S.stake,state:"open",tm:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});
  });
  S.balance-=S.stake*S.slip.length;
  S.slip=[];go("bets");toast("Bet placed successfully",true);
}

/* =========================================================
   UI BİLEŞENLERİ
   ========================================================= */
function oddsBtn(m,mkt,pick,od){
  const k=m.id+"|"+mkt+"|"+pick;const sel=S.slip.find(s=>slipKey(s)===k);
  let cls="odds";
  if(sel)cls+=sel.status==="susp"?" susp":sel.status==="changed"?" chg":" sel";
  return `<button class="${cls}" onclick="event.stopPropagation();add(byId(${m.id}),'${mkt}','${pick}',${od})">${fmt(od)}</button>`;
}
function avatar(name){
  return `<div style="width:26px;height:26px;border-radius:50%;background:${teamColor(name)};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0">${initials(name)}</div>`;
}
function matchRow(m){
  const three=m.odds.length===3;
  const realPicks=three?[m.home,"Draw",m.away]:[m.home,m.away];
  const labels=three?["1","X","2"]:["1","2"];
  const cols=three?"grid-cols-3":"grid-cols-2";
  let h=`<div class="match-row" onclick="go('match/${m.id}')">`;
  h+=`<div class="flex items-center justify-between mb-1.5 text-[10px]"><div class="flex items-center gap-1.5">`;
  if(m.live)h+=`<span class="live-dot"></span><span style="color:var(--live);font-weight:700">LIVE</span><span style="color:var(--text-2)">·</span>`;
  h+=`<span style="color:${m.live?'var(--live)':'var(--text-2)'};font-weight:600">${clock(m)}</span></div><div style="color:var(--text-2)">${m.league}</div></div>`;
  h+=`<div class="flex items-center gap-3"><div class="flex-1 min-w-0 space-y-1">`;
  h+=`<div class="flex items-center gap-1.5">${avatar(m.home)}<span class="text-[13px] font-semibold truncate flex-1">${m.home}</span>${m.live?`<span style="color:var(--accent);font-weight:700">${m.hs}</span>`:''}</div>`;
  h+=`<div class="flex items-center gap-1.5">${avatar(m.away)}<span class="text-[13px] font-semibold truncate flex-1">${m.away}</span>${m.live?`<span style="color:var(--accent);font-weight:700">${m.as}</span>`:''}</div>`;
  h+=`</div><div style="width:52%;min-width:130px"><div class="odds-labels grid ${cols} gap-1">${labels.map(l=>`<span>${l}</span>`).join('')}</div><div class="grid ${cols} gap-1">`;
  m.odds.slice(0,three?3:2).forEach((o,i)=>{h+=`<div>${oddsBtn(m,"Match Result",realPicks[i],o)}</div>`});
  h+=`</div></div></div></div>`;return h;
}
function leagueBlock(g){return `<div class="league-h"><span>${g.league}</span><span style="color:var(--text-2);font-weight:500;font-size:10px;text-transform:none">${g.ms.length} matches</span></div>`+g.ms.map(matchRow).join("")}
function searchHits(){
  const q=S.search.toLowerCase().trim();if(!q)return"";
  let out="";
  S.matches.forEach(m=>{if((m.home+" "+m.away+" "+m.league).toLowerCase().includes(q)){out+=`<div class="px-3 py-2 cursor-pointer text-sm border-b" style="border-color:var(--border)" onclick="go('match/${m.id}')">${m.home} v ${m.away} <span style="color:var(--text-2);font-size:11px">· ${m.league}</span></div>`}});
  return out||'<div class="empty" style="padding:16px"><div class="title">No results</div></div>';
}

/* =========================================================
   SAYFALAR
   ========================================================= */
function pageHome(){
  let h=`<div style="position:relative;margin-bottom:12px">`;
  h+=`<input value="${S.search}" oninput="S.search=this.value;document.getElementById('searchres').innerHTML=searchHits();document.getElementById('searchres').style.display=this.value?'block':'none'" placeholder="Search teams, leagues..." style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px 10px 36px;font-size:13px;color:var(--text);outline:none">`;
  h+=`<span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-2);font-size:14px">🔍</span>`;
  h+=`<div id="searchres" style="display:none;position:absolute;top:100%;left:0;right:0;margin-top:4px;background:var(--surface);border:1px solid var(--border);border-radius:8px;max-height:260px;overflow:auto;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.5)">${searchHits()}</div></div>`;
  h+=`<div class="flex gap-2 overflow-x-auto pb-3" style="scrollbar-width:none">`;
  h+=`<button class="pill ${S.filter==='all'?'on':''}" onclick="S.filter='all';render()">All sports</button>`;
  const sports=[...new Set(S.matches.map(m=>m.sport))];
  sports.forEach(sp=>{h+=`<button class="pill ${S.filter===sp?'on':''}" onclick="S.filter='${sp}';render()">${sp[0].toUpperCase()+sp.slice(1)}</button>`});
  h+=`</div>`;
  const liv=live().filter(m=>S.filter==="all"||m.sport===S.filter);
  h+=`<div class="flex items-center justify-between mb-1 mt-3"><h2 class="text-[14px] font-bold flex items-center gap-1.5"><span class="live-dot"></span>Live now</h2><span style="color:var(--text-2);font-size:11px">${liv.length} in play</span></div>`;
  h+=liv.length?groupByLeague(liv.slice(0,8)).map(leagueBlock).join(""):'<div class="empty"><div class="title">No live matches</div></div>';
  const up=upcoming().filter(m=>S.filter==="all"||m.sport===S.filter);
  h+=`<div class="flex items-center justify-between mb-1 mt-5"><h2 class="text-[14px] font-bold">Upcoming</h2><span style="color:var(--text-2);font-size:11px">Next up</span></div>`;
  h+=up.length?groupByLeague(up.slice(0,6)).map(leagueBlock).join(""):'<div class="empty"><div class="title">Nothing scheduled</div></div>';
  return h;
}
function pageLive(){
  const list=live().filter(m=>S.filter==="all"||m.sport===S.filter);
  let h=`<div class="page-in"><h1 class="text-xl font-bold mb-1">Live</h1><p style="color:var(--text-2);font-size:12px;margin:0 0 12px">Every match in play</p>`;
  h+=`<div class="flex gap-2 overflow-x-auto pb-3" style="scrollbar-width:none">`;
  h+=`<button class="pill ${S.filter==='all'?'on':''}" onclick="S.filter='all';render()">All</button>`;
  const sports=[...new Set(S.matches.map(m=>m.sport))];
  sports.forEach(sp=>{h+=`<button class="pill ${S.filter===sp?'on':''}" onclick="S.filter='${sp}';render()">${sp[0].toUpperCase()+sp.slice(1)}</button>`});
  h+=`</div>`;
  if(list.length)h+=groupByLeague(list).map(leagueBlock).join("");
  else h+=`<div class="card p-6 text-center"><div style="font-size:28px;margin-bottom:6px">⏳</div><div class="font-bold text-sm mb-1">Nothing live right now</div></div>`;
  return h+`</div>`;
}
function pageFootball(){
  const leagues=[...new Set(S.matches.filter(m=>m.sport==="football").map(m=>m.league))];
  let h=`<div class="page-in"><h1 class="text-xl font-bold mb-1">Football</h1><p style="color:var(--text-2);font-size:12px;margin:0 0 12px">Top leagues</p>`;
  leagues.forEach(lg=>{
    const ms=S.matches.filter(m=>m.league===lg);if(!ms.length)return;
    const followed=S.follows.includes(lg);
    h+=`<div class="league-h"><span>${lg}</span><button class="pill text-[10px] px-2 py-0.5 ${followed?'on':''}" onclick="event.stopPropagation();(function(){const i=S.follows.indexOf('${lg}');if(i>=0)S.follows.splice(i,1);else S.follows.push('${lg}');render()})()" style="padding:2px 8px;font-size:10px">${followed?'Following':'Follow'}</button></div>`;
    h+=ms.map(matchRow).join("");
  });
  return h+`</div>`;
}
function pageMatch(){
  const m=byId(S.mid);if(!m)return'<div class="card p-6 text-center" style="color:var(--text-2)">Match not found</div>';
  let h=`<div class="page-in"><button style="background:none;border:none;color:var(--text-2);font-size:12px;font-weight:600;cursor:pointer;margin-bottom:10px;padding:0" onclick="go('home')">← Back</button>`;
  h+=`<div class="card p-4 mb-3"><div class="flex justify-between text-[10px] mb-2"><span style="color:var(--text-2)">${m.league}</span><span style="color:${m.live?'var(--live)':'var(--text-2)'};font-weight:700">${m.live?'LIVE · '+clock(m):clock(m)}</span></div>`;
