<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Housebets Sports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box}
:root{
  --bg:#081120;
  --surface:#0e1a2d;
  --surface-2:#142441;
  --surface-3:#1a2d4d;
  --border:#1c2e4a;
  --border-2:#25385a;
  --text:#e8eef7;
  --text-2:#a8b8d0;
  --muted:#6b7d99;
  --accent:#00e07a;
  --accent-2:#00c76a;
  --accent-soft:rgba(0,224,122,.12);
  --live:#ef4444;
  --amber:#f59e0b;
}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-feature-settings:'tnum','cv11','ss01';
  -webkit-font-smoothing:antialiased;
  letter-spacing:-0.005em;
}
button{font-family:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:#2f4368}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px}
.card-2{background:var(--surface-2);border:1px solid var(--border);border-radius:12px}

/* Odds */
.odds-btn{
  background:var(--surface-2);border:1px solid var(--border-2);
  border-radius:8px;padding:8px 4px;width:100%;cursor:pointer;
  text-align:center;font-weight:600;font-size:13px;
  color:var(--text);font-variant-numeric:tabular-nums;
  transition:all .15s ease;
}
.odds-btn:hover{border-color:var(--accent);background:var(--surface-3);color:var(--accent)}
.odds-btn.sel{background:var(--accent);color:#081120;border-color:var(--accent)}
.odds-btn.sel:hover{background:var(--accent-2);border-color:var(--accent-2);color:#081120}
.odds-btn.susp{opacity:.3;text-decoration:line-through;cursor:not-allowed}
.odds-btn.chg{background:var(--amber);color:#081120;border-color:var(--amber)}
.odds-btn.chg:hover{background:var(--amber);color:#081120;border-color:var(--amber)}

/* Pills */
.pill{
  background:var(--surface-2);border:1px solid var(--border-2);
  border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;
  cursor:pointer;white-space:nowrap;color:var(--text-2);transition:all .15s;
}
.pill:hover{border-color:var(--accent);color:var(--text)}
.pill.on{background:var(--accent);color:#081120;border-color:var(--accent);font-weight:600}
.pill.on:hover{background:var(--accent-2);color:#081120;border-color:var(--accent-2)}

/* Nav */
.nav-item{
  padding:10px 12px;border-radius:8px;cursor:pointer;
  color:var(--text-2);font-size:13.5px;font-weight:500;
  background:none;border:none;width:100%;text-align:left;
  transition:all .12s;display:flex;align-items:center;gap:10px;
}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.on{background:var(--surface-2);color:var(--accent);font-weight:600}
.nav-item.on .nav-dot{background:var(--accent)}

/* Team avatar */
.avatar{
  width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:#fff;
  flex-shrink:0;border:1px solid rgba(255,255,255,.08);
}

/* Match row */
.match-row{
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:12px;margin-bottom:6px;
  cursor:pointer;transition:all .15s;
}
.match-row:hover{border-color:var(--accent);background:var(--surface-2)}

/* League header */
.league-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 12px;background:var(--surface-2);
  border-left:3px solid var(--accent);border-radius:6px;
  margin:14px 0 6px;font-size:12.5px;font-weight:600;
}
.league-header .lg-name{color:var(--text);display:flex;align-items:center;gap:8px}
.league-header .lg-count{color:var(--muted);font-weight:500;font-size:11.5px}

/* Live dot */
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--live);display:inline-block;animation:lp 1.4s infinite}
@keyframes lp{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}

/* Odds labels 1/X/2 */
.odds-labels{display:grid;gap:4px;font-size:10px;color:var(--muted);text-align:center;margin-bottom:3px;font-weight:600;letter-spacing:.04em}

/* Tab bar mobile */
.mobile-tabbar{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--surface);border-top:1px solid var(--border);
  display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom);
}
.mobile-tab{
  flex:1;padding:10px 4px;display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:10px;font-weight:600;
  color:var(--muted);background:none;border:none;cursor:pointer;
  transition:color .15s;
}
.mobile-tab.on{color:var(--accent)}
.mobile-tab-icon{font-size:18px;line-height:1}

/* Toast */
.toast{
  position:fixed;top:76px;left:50%;transform:translateX(-50%);
  padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;
  z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.4);
  animation:toastIn .2s ease;
}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* Balance pill */
.balance-pill{
  background:linear-gradient(135deg,var(--surface-2),var(--surface-3));
  border:1px solid var(--border-2);border-radius:999px;
  padding:6px 12px;font-size:12px;font-weight:600;
  display:flex;align-items:center;gap:6px;
}
.balance-pill .amt{color:var(--accent);font-variant-numeric:tabular-nums}

/* Empty state */
.empty-state{text-align:center;padding:32px 16px;color:var(--muted)}
.empty-state .icon{font-size:32px;margin-bottom:8px;opacity:.5}
.empty-state .title{font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:4px}
.empty-state .desc{font-size:12px}

/* Slip item */
.slip-item{border-bottom:1px solid var(--border);padding:10px 0}
.slip-item:last-child{border-bottom:none}
.slip-badge{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;margin-left:4px}

/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.page-in{animation:fadeIn .2s ease}
</style>
</head>
<body>
<div id="app"></div>
<script>
var SPORTS=[
  {icon:"⚽",name:"Football",key:"football",live:6,hot:true},
  {icon:"🏀",name:"Basketball",key:"basketball",live:1},
  {icon:"🎾",name:"Tennis",key:"tennis",live:1},
  {icon:"🏒",name:"Hockey",key:"hockey",live:0},
  {icon:"🥊",name:"MMA",key:"mma",live:0},
  {icon:"🏏",name:"Cricket",key:"cricket",live:0}
];
var LEAGUES=[
  {name:"Premier League",flag:"🏴",key:"pl"},
  {name:"Champions League",flag:"🇪🇺",key:"cl"},
  {name:"LaLiga",flag:"🇪🇸",key:"ll"},
  {name:"Serie A",flag:"🇮🇹",key:"sa"},
  {name:"Bundesliga",flag:"🇩🇪",key:"bl"}
];
var M=[
{id:1,sp:"football",lg:"Premier League",flag:"🏴",h:"Arsenal",a:"Brighton",hs:2,as:1,mn:67,lv:1,o:[2.10,3.40,3.60]},
{id:2,sp:"football",lg:"Premier League",flag:"🏴",h:"Chelsea",a:"Newcastle",hs:0,as:0,mn:31,lv:1,o:[2.45,3.20,2.90]},
{id:3,sp:"football",lg:"LaLiga",flag:"🇪🇸",h:"Real Madrid",a:"Sevilla",hs:1,as:0,mn:54,lv:1,o:[1.35,5.00,8.50]},
{id:4,sp:"football",lg:"Serie A",flag:"🇮🇹",h:"Inter",a:"Roma",hs:2,as:2,mn:78,lv:1,o:[1.90,3.60,3.90]},
{id:5,sp:"football",lg:"Bundesliga",flag:"🇩🇪",h:"Bayern",a:"Dortmund",hs:1,as:1,mn:45,lv:1,o:[1.70,4.00,4.20]},
{id:6,sp:"football",lg:"Champions League",flag:"🇪🇺",h:"Man City",a:"PSG",hs:0,as:0,mn:12,lv:1,o:[1.85,3.80,4.00]},
{id:7,sp:"basketball",lg:"NBA",flag:"🇺🇸",h:"Lakers",a:"Celtics",hs:78,as:82,mn:38,lv:1,o:[2.05,1.78]},
{id:8,sp:"tennis",lg:"ATP Masters",flag:"🎾",h:"Alcaraz",a:"Sinner",hs:1,as:1,mn:0,lv:1,o:[1.65,2.20]},
{id:9,sp:"football",lg:"Premier League",flag:"🏴",h:"Liverpool",a:"Everton",hs:0,as:0,mn:-90,lv:0,o:[1.45,4.20,6.50]},
{id:10,sp:"football",lg:"LaLiga",flag:"🇪🇸",h:"Barcelona",a:"Atletico",hs:0,as:0,mn:-180,lv:0,o:[1.95,3.40,3.80]},
{id:11,sp:"football",lg:"Champions League",flag:"🇪🇺",h:"Bayern",a:"Real Madrid",hs:0,as:0,mn:-1440,lv:0,o:[2.30,3.50,2.90]},
{id:12,sp:"basketball",lg:"NBA",flag:"🇺🇸",h:"Warriors",a:"Suns",hs:0,as:0,mn:-300,lv:0,o:[1.90,1.90]}
];
var TABS=["Popular","Goals","Halves","Handicaps","Goalscorers","Corners"];
var MKT={
Popular:[["Match Result",["Home","Draw","Away"],[2.10,3.40,3.60]],["BTTS",["Yes","No"],[1.72,2.05]],["Total 2.5",["Over","Under"],[1.88,1.92]]],
Goals:[["Total 1.5",["Over","Under"],[1.30,3.40]],["Total 3.5",["Over","Under"],[2.60,1.48]],["Home 1.5",["Over","Under"],[1.95,1.80]]],
Halves:[["1st Half",["Home","Draw","Away"],[2.60,2.10,4.20]],["2nd Half",["Home","Draw","Away"],[2.20,2.40,4.60]]],
Handicaps:[["Home -1",["Home","Away"],[1.95,1.85]],["Away +1",["Home","Away"],[1.70,2.10]],["Asian 0.5",["Home","Away"],[1.88,1.92]]],
Goalscorers:[["Saka Anytime",["Yes","No"],[2.30,1.55]],["Havertz Anytime",["Yes","No"],[2.60,1.45]],["Mitoma Anytime",["Yes","No"],[3.40,1.28]]],
Corners:[["Total Corners 9.5",["Over","Under"],[1.85,1.90]],["Home Most Corners",["Yes","No"],[1.75,2.00]],["Card in Match",["Yes","No"],[1.40,2.70]]]
};
var S={route:"home",mid:1,slip:[],stake:10,bets:[{id:1,lbl:"Liverpool v Everton",pick:"Liverpool",mkt:"Match Result",od:1.45,st:25,state:"settled",tm:"Yesterday"},],foll:[],lf:"all",tab:"Popular",btab:"open",srch:"",toast:null,susp:{},balance:1250.00};

function go(r){location.hash="#/"+r}
function byId(i){for(var x=0;x<M.length;x++)if(M[x].id===i)return M[x];return null}
function live(){return M.filter(function(m){return m.lv})}
function soon(){return M.filter(function(m){return !m.lv})}
function pot(){return S.slip.reduce(function(a,s){return s.status==="ok"?a+S.stake*s.od:a},0)}
function key(s){return s.mid+"|"+s.mkt+"|"+s.pick}
function isS(k){if(!(k in S.susp))S.susp[k]=Math.random()<0.06;return S.susp[k]}
function clk(m){if(m.lv)return m.mn+"'";if(m.mn===-90)return "20:00";if(m.mn===-180)return "21:30";if(m.mn===-1440)return "Tomorrow";if(m.mn===-300)return "Tomorrow";if(m.mn===-240)return "19:45";return "Soon"}
function toast(t,ok){S.toast={t:t,ok:ok};render();setTimeout(function(){S.toast=null;render()},3200)}
function teamColor(name){
  var h=0;for(var i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))%360;
  return 'hsl('+h+', 42%, 32%)';
}
function initials(name){
  var parts=name.trim().split(' ');
  if(parts.length>1)return (parts[0][0]+parts[1][0]).toUpperCase();
  return name.slice(0,2).toUpperCase();
}
function fmt(n){return n.toFixed(2)}

function groupByLeague(list){
  var out=[],seen={};
  list.forEach(function(m){
    if(!seen[m.lg]){seen[m.lg]={lg:m.lg,flag:m.flag,ms:[]};out.push(seen[m.lg])}
    seen[m.lg].ms.push(m);
  });
  return out;
}

function add(m,mkt,pick,od){
  var s={mid:m.id,lbl:m.h+" v "+m.a,mkt:mkt,pick:pick,od:od,status:"ok",old:od};
  var k=key(s);var ex=null;
  for(var i=0;i<S.slip.length;i++)if(key(S.slip[i])===k)ex=S.slip[i];
  if(ex){S.slip=S.slip.filter(function(x){return key(x)!==k});return render()}
  var r=Math.random();
  if(r<0.16){s.status="changed";s.old=od;s.od=+(od+(Math.random()*0.28-0.14)).toFixed(2)}
  else if(r<0.26){s.status="susp"}
  S.slip.push(s);render();
}
function acc(k){for(var i=0;i<S.slip.length;i++)if(key(S.slip[i])===k)S.slip[i].status="ok";render()}
function rem(k){S.slip=S.slip.filter(function(x){return key(x)!==k});render()}
function place(){
  if(!S.slip.length||S.slip.some(function(s){return s.status!=="ok"}))return;
  if(pot()>S.balance){return toast("Insufficient balance",false)}
  if(Math.random()<0.1){S.slip.forEach(function(s){s.status="susp"});return toast("Bet failed - market moved",false)}
  S.slip.forEach(function(s){
    S.bets.unshift({id:Date.now()+Math.random(),lbl:s.lbl,pick:s.pick,mkt:s.mkt,od:s.od,st:S.stake,state:"open",tm:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});
  });
  S.balance-=S.stake*S.slip.length;
  S.slip=[];go("bets");toast("Bet placed successfully",true);
}

function oddsBtn(m,mkt,pick,od){
  var k=m.id+"|"+mkt+"|"+pick;var sel=null;
  for(var i=0;i<S.slip.length;i++)if(key(S.slip[i])===k)sel=S.slip[i];
  var cls="odds-btn";
  if(sel)cls+=(sel.status==="susp"?" susp":sel.status==="changed"?" chg":" sel");
  return '<button class="'+cls+'" onclick="event.stopPropagation();add(byId('+m.id+'),\''+mkt+'\',\''+pick+'\','+od+')">'+fmt(od)+'</button>';
}

function avatar(name){
  return '<div class="avatar" style="background:'+teamColor(name)+'">'+initials(name)+'</div>';
}

function matchRow(m){
  var three=m.o.length===3;
  var realPicks=three?[m.h,"Draw",m.a]:[m.h,m.a];
  var labels=three?["1","X","2"]:["1","2"];
  var cols=three?"grid-cols-3":"grid-cols-2";
  var h='<div class="match-row" onclick="go(\'match/'+m.id+'\')">';
  // meta line
  h+='<div class="flex items-center justify-between mb-2 text-[11px]">';
  h+='<div class="flex items-center gap-1.5">';
  if(m.lv){h+='<span class="live-dot"></span><span style="color:var(--live);font-weight:600">LIVE</span><span style="color:var(--muted)">·</span>'}
  h+='<span style="color:'+(m.lv?"var(--live)":"var(--muted)")+';font-weight:600">'+clk(m)+'</span>';
  h+='</div>';
  h+='<div style="color:var(--muted)">'+m.lg+'</div>';
  h+='</div>';
  // teams + odds
  h+='<div class="flex items-center gap-3">';
  h+='<div class="flex-1 min-w-0 space-y-1.5">';
  // home row
  h+='<div class="flex items-center gap-2">'+avatar(m.h)+'<span class="text-sm font-semibold truncate flex-1">'+m.h+'</span>'+(m.lv?'<span style="color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums">'+m.hs+'</span>':'')+'</div>';
  // away row
  h+='<div class="flex items-center gap-2">'+avatar(m.a)+'<span class="text-sm font-semibold truncate flex-1">'+m.a+'</span>'+(m.lv?'<span style="color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums">'+m.as+'</span>':'')+'</div>';
  h+='</div>';
  // odds column
  h+='<div style="width:50%;min-width:130px">';
  h+='<div class="odds-labels grid '+cols+' gap-1">'+labels.map(function(l){return '<span>'+l+'</span>'}).join('')+'</div>';
  h+='<div class="grid '+cols+' gap-1">';
  for(var i=0;i<m.o.length;i++)h+='<div>'+oddsBtn(m,"Match Result",realPicks[i],m.o[i])+'</div>';
  h+='</div></div></div></div>';
  return h;
}

function leagueBlock(g){
  var h='<div class="league-header">';
  h+='<div class="lg-name"><span>'+g.flag+'</span><span>'+g.lg+'</span></div>';
  h+='<div class="lg-count">'+g.ms.length+' '+(g.ms.length===1?'match':'matches')+'</div>';
  h+='</div>';
  h+=g.ms.map(matchRow).join("");
  return h;
}

function searchHits(){
  var q=S.srch.toLowerCase().trim();if(!q)return"";
  var out="";
  M.forEach(function(m){
    if((m.h+" "+m.a+" "+m.lg).toLowerCase().indexOf(q)>=0){
      out+='<div style="padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px" onclick="go(\'match/'+m.id+'\')">';
      out+='<span style="color:var(--accent)">⚽</span>';
      out+='<div style="flex:1"><div style="font-size:13px;font-weight:600">'+m.h+' v '+m.a+'</div><div style="font-size:11px;color:var(--muted);margin-top:2px">'+m.lg+'</div></div>';
      out+='<span style="color:var(--muted);font-size:12px">→</span></div>';
    }
  });
  LEAGUES.forEach(function(l){
    if(l.name.toLowerCase().indexOf(q)>=0){
      out+='<div style="padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px" onclick="go(\'football\')">';
      out+='<span style="font-size:16px">'+l.flag+'</span>';
      out+='<div style="flex:1;font-size:13px;font-weight:600">'+l.name+'</div>';
      out+='<span style="font-size:11px;color:var(--muted)">Competition</span></div>';
    }
  });
  return out||'<div class="empty-state"><div class="icon">🔍</div><div class="title">No results</div><div class="desc">Try a different search</div></div>';
}

function pageHome(){
  var h='<div style="position:relative;margin-bottom:16px">';
  h+='<input value="'+S.srch+'" oninput="S.srch=this.value;document.getElementById(\'searchres\').innerHTML=searchHits();document.getElementById(\'searchres\').style.display=this.value?\'block\':\'none\'" placeholder="Search teams, players, competitions, markets" style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px 12px 40px;font-size:13px;color:var(--text);outline:none;transition:border .15s" onfocus="this.style.borderColor=\'var(--accent)\'" onblur="this.style.borderColor=\'var(--border)\'">';
  h+='<span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px">🔍</span>';
  h+='<div id="searchres" style="display:'+(S.srch?'block':'none')+';position:absolute;top:100%;left:0;right:0;margin-top:6px;background:var(--surface);border:1px solid var(--border);border-radius:10px;max-height:300px;overflow:auto;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.5)">'+(S.srch?searchHits():"")+'</div></div>';

  // sport pills
  h+='<div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none">';
  h+='<button class="pill '+(S.lf==="all"?"on":"")+'" onclick="S.lf=\'all\';render()">All sports</button>';
  SPORTS.forEach(function(s){
    h+='<button class="pill '+(S.lf===s.key?"on":"")+'" onclick="S.lf=\''+s.key+'\';render()">'+s.icon+' '+s.name+'</button>';
  });
  h+='</div>';

  // Live now
  var liv=live().filter(function(m){return S.lf==="all"||m.sp===S.lf});
  h+='<div style="display:flex;align-items:center;justify-content:space-between;margin:16px 0 4px">';
  h+='<h2 style="font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin:0"><span class="live-dot"></span>Live now</h2>';
  h+='<span style="font-size:12px;color:var(--muted)">'+liv.length+' in play</span></div>';
  h+=liv.length?groupByLeague(liv.slice(0,6)).map(leagueBlock).join(""):'<div class="empty-state"><div class="icon">⏳</div><div class="title">No live matches</div><div class="desc">Check Starting soon below</div></div>';

  // Starting soon
  var sn=soon().filter(function(m){return S.lf==="all"||m.sp===S.lf});
  h+='<div style="display:flex;align-items:center;justify-content:space-between;margin:20px 0 4px">';
  h+='<h2 style="font-size:15px;font-weight:700;margin:0">Starting soon</h2>';
  h+='<span style="font-size:12px;color:var(--muted)">Next up</span></div>';
  h+=sn.length?groupByLeague(sn.slice(0,4)).map(leagueBlock).join(""):'<div class="empty-state"><div class="title">Nothing scheduled</div></div>';

  // Top competitions
