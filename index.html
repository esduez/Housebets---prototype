<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Housebets — Sportsbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@800;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg: #0b141c; --surface: #121c24; --surface-2: #192833; --surface-3: #233442;
  --border: #1c2a36; --text: #ffffff; --text-2: #8b9eb0;
  --accent: #00e5ff; --accent-dim: rgba(0, 229, 255, 0.15);
  --live: #ff4444; --warn: #ffaa00; --radius: 12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-feature-settings:'tnum';-webkit-font-smoothing:antialiased;padding-bottom:80px}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{display:none}
.logo-font{font-family:'Poppins',sans-serif;letter-spacing:-0.04em}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);transition:border-color .2s}
.card:hover{border-color:var(--surface-3)}
.pill{background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:8px 16px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--text-2);transition:all .2s;display:flex;align-items:center;gap:6px;text-decoration:none}
.pill.on{background:var(--accent);color:#000;border-color:var(--accent)}
.tab{flex:1;padding:12px;text-align:center;font-size:13px;font-weight:700;color:var(--text-2);border-bottom:2px solid transparent;cursor:pointer;transition:all .2s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-dim)}
.nav{padding:10px 14px;border-radius:8px;cursor:pointer;color:var(--text-2);font-size:13px;font-weight:600;background:none;border:none;width:100%;text-align:left;transition:all .15s;display:flex;align-items:center;gap:12px;text-decoration:none}
.nav:hover{background:var(--surface-2);color:var(--text)}
.nav.on{background:var(--accent-dim);color:var(--accent)}
.match-row{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:6px;cursor:pointer;transition:all .2s;display:block;text-decoration:none;color:inherit}
.match-row:hover{border-color:var(--accent);background:var(--surface-2)}
.league-h{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--surface-2);border-left:3px solid var(--accent);border-radius:6px;margin:16px 0 6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--live);display:inline-block;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}
.odds-labels{display:grid;gap:4px;font-size:9px;color:var(--text-2);text-align:center;margin-bottom:4px;font-weight:700;letter-spacing:.03em}
.odds{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 6px;width:100%;text-align:center;font-weight:700;font-size:13px;color:var(--text);font-variant-numeric:tabular-nums;transition:all .18s cubic-bezier(0.4,0,0.2,1)}
.odds:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,229,255,0.15)}
.odds.sel{background:var(--accent);color:#000;border-color:var(--accent);font-weight:800}
.odds.susp{opacity:.25;text-decoration:line-through;cursor:not-allowed;background:var(--surface-3)}
.odds.chg{background:var(--warn);color:#000;border-color:var(--warn);font-weight:800}
.mobile-tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.mobile-tab{flex:1;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;font-weight:700;color:var(--text-2);background:none;border:none;transition:color .15s;text-decoration:none}
.mobile-tab.on{color:var(--accent)}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:10px;font-size:13px;font-weight:700;z-index:100;box-shadow:0 12px 32px rgba(0,0,0,0.6);animation:slideDown .25s cubic-bezier(0.4,0,0.2,1)}
@keyframes slideDown{from{top:40px;opacity:0}to{top:70px;opacity:1}}
.balance-pill{background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.balance-pill .amt{color:var(--accent);font-variant-numeric:tabular-nums}
.slip-item{border-bottom:1px solid var(--border);padding:12px 0}
.slip-item:last-child{border-bottom:none}
.badge{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:800;letter-spacing:.02em}
.stat-bar-container{margin-bottom:14px}
.stat-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-2);font-weight:600;margin-bottom:6px}
.stat-bar{height:6px;background:var(--surface-3);border-radius:3px;overflow:hidden;display:flex}
.stat-bar-home{background:var(--accent);height:100%}
.stat-bar-away{background:var(--text-2);height:100%}
.model-box{background:rgba(0,229,255,0.05);border:1px solid rgba(0,229,255,0.2);border-radius:8px;padding:14px;margin-bottom:10px}
.model-title{font-size:12px;font-weight:800;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.model-val{font-size:13px;font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between}
.model-val span:last-child{color:#fff;font-weight:800}
.fade-in{animation:fadeIn .25s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.slide-up{animation:slideUp .3s cubic-bezier(0.4,0,0.2,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.form-box{width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:10px;font-weight:800;color:#000}
.form-W{background:#00e676;}
.form-D{background:#8b9eb0;}
.form-L{background:#ff4444;color:#fff;}
.h2h-table{width:100%;border-collapse:collapse;font-size:11px;}
.h2h-table td, .h2h-table th{padding:8px 4px;border-bottom:1px solid var(--border);text-align:center;}
.h2h-table th{color:var(--text-2);font-weight:600;}
.quick-btn{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:6px 0;font-size:11px;font-weight:800;color:#fff;transition:all .15s}
.quick-btn:hover{border-color:var(--accent);color:var(--accent)}
.quick-btn.on{background:var(--accent);color:#000;border-color:var(--accent)}
.follow-star{cursor:pointer;font-size:14px;color:#555;margin-left:4px;transition:color .2s}
.follow-star.active{color:#ffaa00;}
</style>
</head>

var S = {
  route:"home", mid:1, matches:[],
  slip:[], stake:10,
  bets:[
    {id:1,lbl:"Arsenal v Chelsea",pick:"Arsenal",mkt:"Match Result",od:2.10,st:25,state:"settled",tm:"Yesterday 20:14",res:"WON",ret:52.50},
    {id:2,lbl:"Real Madrid v Barcelona",pick:"Over 2.5",mkt:"Total Goals",od:1.85,st:50,state:"settled",tm:"Yesterday 18:00",res:"WON",ret:92.50},
    {id:3,lbl:"Lakers v Warriors",pick:"Lakers",mkt:"Match Result",od:1.90,st:10,state:"settled",tm:"2 days ago",res:"LOST",ret:0}
  ],
  follows:["Arsenal","Premier League"],
  filter:"all", 
  marketTab:"Markets", matchTab:"Markets", betsTab:"open",
  search:"", toast:null, susp:{}, balance:1250.00
};

/* =========================================================
   STATS GENERATOR
   ========================================================= */
function getTeamStats(name) {
  var seed = 0;
  for(var i=0; i<name.length; i++) seed += name.charCodeAt(i);
  var pos = (seed % 16) + 1;
  var played = 20 + (seed % 5);
  var w = 8 + (seed % 8);
  var d = 2 + (seed % 5);
  var l = played - w - d;
  var pts = w*3 + d;
  var form = [];
  for(var i=0; i<10; i++) {
    var v = (seed + i * 7) % 10;
    form.push(v < 5 ? "W" : v < 7 ? "D" : "L");
  }
  var last10 = [];
  for(var i=0; i<10; i++) {
    last10.push({
      date: "May " + ((seed+i)%28 + 1),
      opp: "Opponent " + String.fromCharCode(65 + ((seed+i)%26)),
      res: form[i],
      score: ((seed+i)%3) + "-" + ((seed+i*2)%3)
    });
  }
  return { pos: pos, played: played, w: w, d: d, l: l, pts: pts, form: form, last10: last10 };
}

/* =========================================================
   CORE & NAVIGATION (Garantili Geçiş)
   ========================================================= */
window.nav = function(route, id) {
  S.route = route;
  if (id !== undefined) S.mid = id;
  window.scrollTo(0, 0);
  render();
};

window.toggleFollow = function(name) {
  var idx = S.follows.indexOf(name);
  if(idx >= 0) S.follows.splice(idx, 1);
  else S.follows.push(name);
  render();
};

function byId(id){for(var i=0;i<S.matches.length;i++)if(S.matches[i].id===id)return S.matches[i];return null}
function live(){return S.matches.filter(function(m){return m.live})}
function upcoming(){return S.matches.filter(function(m){return !m.live})}
function potential(){return S.slip.reduce(function(a,s){return s.status==="ok"?a+S.stake*s.od:a},0)}
function slipKey(s){return s.mid+"|"+s.mkt+"|"+s.pick}
function isSusp(k){if(!(k in S.susp))S.susp[k]=Math.random()<0.06;return S.susp[k]}
function clock(m){ if(m.live) return m.min+"'"; return m.timeStr || "Soon"; }
function toast(t,ok){S.toast={t:t,ok:ok};render();setTimeout(function(){S.toast=null;render()},3500)}
function fmt(n){return Number(n).toFixed(2)}
function teamColor(name){var h=0;for(var i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))%360;return "hsl("+h+",45%,30%)"}
function initials(name){var p=name.trim().split(" ");return p.length>1?(p[0][0]+p[1][0]).toUpperCase():name.slice(0,2).toUpperCase()}
function groupByLeague(list){var out=[],seen={};list.forEach(function(m){if(!seen[m.league]){seen[m.league]={league:m.league,ms:[]};out.push(seen[m.league])}seen[m.league].ms.push(m)});return out}

/* =========================================================
   BET SLIP
   ========================================================= */
function add(m,mkt,pick,od){
  var s={mid:m.id,lbl:m.home+" v "+m.away,mkt:mkt,pick:pick,od:od,status:"ok",old:od};
  var k=slipKey(s);var ex=null;
  for(var i=0;i<S.slip.length;i++)if(slipKey(S.slip[i])===k)ex=S.slip[i];
  if(ex){S.slip=S.slip.filter(function(x){return slipKey(x)!==k});return render()}
  var r=Math.random();
  if(r<0.16){s.status="changed";s.old=od;s.od=+(od+(Math.random()*0.28-0.14)).toFixed(2)}
  else if(r<0.26){s.status="susp"}
  S.slip.push(s);render();
}
function acceptOdds(k){for(var i=0;i<S.slip.length;i++)if(slipKey(S.slip[i])===k)S.slip[i].status="ok";render()}
function removeSel(k){S.slip=S.slip.filter(function(x){return slipKey(x)!==k});render()}
function placeBet(){
  if(!S.slip.length||S.slip.some(function(s){return s.status!=="ok"}))return;
  if(potential()>S.balance){return toast("Insufficient balance",false)}
  if(Math.random()<0.1){S.slip=S.slip.map(function(s){return Object.assign({},s,{status:"susp"})});return toast("Bet failed — market moved.",false)}
  S.slip.forEach(function(s){
    S.bets.unshift({
      id:Date.now()+Math.random(), lbl:s.lbl, pick:s.pick, mkt:s.mkt, od:s.od, st:S.stake, 
      state:"open", tm:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),
      ret: S.stake * s.od
    });
  });
  S.balance-=S.stake*S.slip.length;
  S.slip=[];nav('bets');toast("Bet placed successfully",true);
}

/* =========================================================
   UI COMPONENTS
   ========================================================= */
function oddsBtn(m,mkt,pick,od,label){
  var k=m.id+"|"+mkt+"|"+pick;var sel=null;
  for(var i=0;i<S.slip.length;i++)if(slipKey(S.slip[i])===k)sel=S.slip[i];
  var cls="odds";
  if(sel)cls+=sel.status==="susp"?" susp":sel.status==="changed"?" chg":" sel";
  if(label) {
      return '<button class="'+cls+'" onclick="event.preventDefault();event.stopPropagation();add(byId('+m.id+'),\''+mkt+'\',\''+pick+'\','+od+')" style="display:flex;justify-content:space-between;padding:10px 12px"><span style="color:inherit;font-size:12px;opacity:0.8">'+label+'</span><span>'+fmt(od)+'</span></button>';
  }
  return '<button class="'+cls+'" onclick="event.preventDefault();event.stopPropagation();add(byId('+m.id+'),\''+mkt+'\',\''+pick+'\','+od+')">'+fmt(od)+'</button>';
}

function avatar(name, logoUrl){
  if(logoUrl) {
    return '<div style="width:28px;height:28px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;border:1px solid rgba(255,255,255,0.1)"><img src="'+logoUrl+'" style="width:80%;height:80%;object-fit:contain" onerror="this.parentNode.innerHTML=\''+initials(name)+'\';this.parentNode.style.background=\''+teamColor(name)+'\';this.parentNode.style.color=\'#fff\';this.parentNode.style.fontSize=\'11px\';this.parentNode.style.fontWeight=\'800\'"></div>';
  }
  return '<div style="width:28px;height:28px;border-radius:50%;background:'+teamColor(name)+';display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0;border:1px solid rgba(255,255,255,0.08)">'+initials(name)+'</div>';
}

function matchRow(m){
  var three=m.odds.length===3;
  var picks=three?[m.home,"draw",m.away]:[m.home,m.away];
  var labels=three?["1","X","2"]:["1","2"];
  var cols=three?"grid-cols-3":"grid-cols-2";
  var logoH = m.logos ? m.logos[0] : null;
  var logoA = m.logos ? m.logos[1] : null;
  
  var isHomeFav = S.follows.includes(m.home);
  var isAwayFav = S.follows.includes(m.away);

  var h='<div class="match-row fade-in" onclick="nav(\'match\', '+m.id+')">';
  h+='<div class="flex items-center justify-between mb-2 text-[10px]"><div class="flex items-center gap-1.5">';
  if(m.live)h+='<span class="live-dot"></span><span style="color:#ff4444;font-weight:800">LIVE</span><span style="color:#555">·</span>';
  h+='<span style="color:'+(m.live?"#ff4444":"#8b9eb0")+';font-weight:700">'+clock(m)+'</span></div><div style="color:#7a8f9e;font-weight:600">'+m.league+'</div></div>';
  
  h+='<div class="flex items-center gap-3"><div class="flex-1 min-w-0 space-y-1.5">';
  
  // Ev Sahibi
  h+='<div class="flex items-center gap-2">'+avatar(m.home, logoH);
  h+='<span class="text-[13px] font-semibold truncate flex-1" onclick="event.stopPropagation(); toggleFollow(\''+m.home+'\')">'+m.home+' <span class="follow-star '+(isHomeFav?'active':'')+'">'+(isHomeFav?'★':'☆')+'</span></span>';
  h+=(m.live?'<span style="color:#00e5ff;font-weight:800">'+m.hs+'</span>':'')+'</div>';
  
  // Deplasman
  h+='<div class="flex items-center gap-2">'+avatar(m.away, logoA);
  h+='<span class="text-[13px] font-semibold truncate flex-1" onclick="event.stopPropagation(); toggleFollow(\''+m.away+'\')">'+m.away+' <span class="follow-star '+(isAwayFav?'active':'')+'">'+(isAwayFav?'★':'☆')+'</span></span>';
  h+=(m.live?'<span style="color:#00e5ff;font-weight:800">'+m.as+'</span>':'')+'</div>';
  
  h+='</div>';
  
  h+='<div style="width:52%;min-width:135px"><div class="odds-labels grid '+cols+' gap-1">';
  labels.forEach(function(l){h+='<span>'+l+'</span>'});
  h+='</div><div class="grid '+cols+' gap-1">';

      h+='<div class="slip-item"><div class="flex justify-between" style="font-size:9px;color:#7a8f9e;margin-bottom:2px"><span>'+b.tm+' · Single</span><span style="color:'+statusColor+';font-weight:800">'+statusText+'</span></div>';
      h+='<div style="font-size:10px;color:#8b9eb0">'+b.lbl+'</div>';
      h+='<div class="flex justify-between" style="font-size:12px;margin-top:2px"><span class="font-bold">'+b.pick+'</span><span class="font-extrabold" style="font-variant-numeric:tabular-nums">'+fmt(b.od)+'</span></div>';
      
      if(b.state==="open") {
         h+='<div class="flex justify-between" style="font-size:10px;margin-top:4px;color:#7a8f9e"><span>Stake: '+b.st+' USDT</span><span style="color:#00e5ff;font-weight:800">Return: '+fmt(b.st*b.od)+' USDT</span></div>';
         h+='<button style="margin-top:6px;background:rgba(0,229,255,0.1);border:1px solid rgba(0,229,255,0.3);color:#00e5ff;font-size:10px;font-weight:800;cursor:pointer;padding:5px 10px;border-radius:6px" onclick="toast(\'Cash out requested (demo)\',true)">Cash Out '+fmt(b.st*0.92)+' USDT</button>';
      } else {
         h+='<div class="flex justify-between" style="font-size:10px;margin-top:4px;color:#7a8f9e"><span>Stake: '+b.st+' USDT</span><span style="color:'+(b.res==="WON"?"#00e676":"#ff4444")+';font-weight:800">'+(b.res==="WON"?"Return: "+fmt(b.ret)+" USDT":"Return: 0 USDT")+'</span></div>';
      }
      h+='</div>';
    });
  }else{
    h+='<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">No '+(S.betsTab==="open"?"open":"previous")+' bets</div></div>';
  }
  return h+'</div></div>';
}

/* =========================================================

  h+='<button class="md:hidden" style="background:none;border:none;color:#7a8f9e;font-size:20px;cursor:pointer;padding:0" onclick="document.getElementById(\'drawer\').classList.toggle(\'open\')">☰</button>';
  h+='<div onclick="nav(\'home\')" class="logo-font" style="font-size:22px;font-weight:900;cursor:pointer;"><span style="color:#00e5ff">H</span><span style="color:#fff">ousebets</span></div>';
  h+='<nav class="hidden md:flex" style="gap:2px;margin-left:20px">';
  NAV.forEach(function(n){h+='<div onclick="nav(\''+n[0]+'\')" class="nav '+(S.route===n[0]?"on":"")+'" style="width:auto;padding:7px 14px;cursor:pointer">'+n[1]+'</div>'});
  h+='</nav><div style="flex:1"></div>';
  h+='<div class="balance-pill hidden sm:flex"><span style="color:#7a8f9e;font-size:10px;font-weight:700">Balance</span><span class="amt">'+fmt(S.balance)+'</span><span style="color:#7a8f9e;font-size:9px">USDT</span></div>';
  h+='<button style="background:#192833;border:1px solid #1c2a36;border-radius:999px;padding:6px 14px;font-size:11px;font-weight:800;color:#fff;cursor:pointer;display:flex;align-items:center;gap:6px"><span style="color:#00e5ff">●</span>Demo</button>';
  h+='</header>';
  
  h+='<div style="max-width:1280px;margin:0 auto;display:flex">';
  h+='<aside id="drawer" class="hidden md:block" style="width:200px;border-right:1px solid #1c2a36;min-height:calc(100vh - 56px);padding:16px 10px;flex-shrink:0">';
  NAV.forEach(function(n){h+='<div onclick="nav(\''+n[0]+'\')" class="nav '+(S.route===n[0]?"on":"")+'" style="cursor:pointer"><span style="width:18px;text-align:center">'+n[2]+'</span><span>'+n[1]+'</span></div>'});
  h+='<div style="font-size:9px;font-weight:800;color:#555;padding:20px 14px 6px;letter-spacing:.1em">SPORTS</div>';
  var sportsList=[...new Set(S.matches.map(function(m){return m.sport}))];
  sportsList.forEach(function(sp){
    var cnt=S.matches.filter(function(m){return m.sport===sp&&m.live}).length;
    var icon = sp==="football"?"⚽":sp==="basketball"?"🏀":sp==="esports"?"🎮":sp==="tennis"?"🎾":"🥊";
    var label = sp==="football"?"Football":sp==="basketball"?"Basketball":sp==="esports"?"Esports":sp[0].toUpperCase()+sp.slice(1);
    h+='<div onclick="S.filter=\''+sp+'\';nav(\'live\')" class="nav" style="cursor:pointer"><span style="width:18px;text-align:center">'+icon+'</span><span style="flex:1">'+label+'</span>';
    if(cnt)h+='<span style="font-size:9px;background:rgba(255,68,68,0.15);color:#ff8a80;padding:2px 6px;border-radius:4px;font-weight:800">'+cnt+'</span>';
    h+='</div>';
  });
  h+='<div style="margin-top:28px;padding:12px;background:#121c24;border-radius:8px;border:1px solid #1c2a36"><div style="font-size:9px;color:#555;line-height:1.6">18+ only. Demo data. No real money. Play responsibly.</div></div>';
  h+='</aside>';
  
  h+='<main style="flex:1;min-width:0;padding:16px 16px 88px"><div style="max-width:720px;margin:0 auto">'+html+'</div></main>';
  
  if(S.route!=="bets"){
    h+='<aside class="hidden xl:block" style="width:320px;border-left:1px solid #1c2a36;padding:16px;min-height:calc(100vh - 56px);flex-shrink:0">';
    h+='<div class="card" style="padding:16px;position:sticky;top:72px"><div class="flex justify-between items-center mb-3"><h3 class="text-[13px] font-bold">Bet Slip</h3><span style="font-size:10px;color:#7a8f9e;font-weight:700">'+S.slip.length+' selections</span></div>'+slipBody()+'</div>';
    h+='</aside>';
  }

  if(S.slip.length&&S.route!=="bets"){
    h+='<div onclick="nav(\'bets\')" class="md:hidden slide-up" style="position:fixed;bottom:0;left:0;right:0;background:#121c24;border-top:2px solid #00e5ff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:40;cursor:pointer;box-shadow:0 -8px 24px rgba(0,0,0,0.6);">';

    h+='<button style="background:#00e5ff;color:#000;font-weight:900;border:none;padding:10px 20px;border-radius:8px;font-size:13px">Open Slip →</button></div>';
  }else if(!S.slip.length){

}

/* =========================================================
   RENDER
   ========================================================= */
function render(){
  var html = '';
  if(S.route === 'home') html = pageHome();
  else if(S.route === 'live') html = pageLive();
  else if(S.route === 'football') html = pageHome();
  else if(S.route === 'match') html = pageMatch();
  else if(S.route === 'bets') html = pageBets();
  else html = pageHome();
  
  document.getElementById("app").innerHTML = shell(html);
}

/* =========================================================
   LIVE SIMULATION
   ========================================================= */
setInterval(function(){
  var updated=false;
  S.matches.forEach(function(m){
    if(m.live && !m.paused){
      m.min++;
      updated=true;
      if(m.sport==="football" && m.min > 90){ m.live = false; m.min = 90; }
      if(m.sport==="football" && m.min < 90 && Math.random() < 0.02){
        if(Math.random() < 0.5) m.hs++; else m.as++;
        m.justScored = true;
        setTimeout(function(){ m.justScored = false; render(); }, 2500);
        for(var key in S.susp) { if(key.indexOf(m.id+"|") === 0) S.susp[key] = true; }
        setTimeout(function(){
           for(var key in S.susp) { if(key.indexOf(m.id+"|") === 0) delete S.susp[key]; }
           render();
        }, 4000);
      }
    }
  });
  if(S.route==="match"){
    var currentM=byId(S.mid);
    if(currentM && currentM.live){
       currentM.odds=currentM.odds.map(function(o){
         if(Math.random()<0.2) return Math.max(1.01, +(o + (Math.random()*0.1-0.05)).toFixed(2));
         return o;
       });
       S.slip.forEach(function(s){
         if(s.mid===currentM.id && s.status==="ok" && Math.random()<0.1){
            s.status="changed"; s.old=s.od; s.od=+(s.od+(Math.random()*0.2-0.1)).toFixed(2);
         }
       });
       updated=true;
    }
  }
  if(updated && (S.route==="match"||S.route==="home"||S.route==="live")){
    if(document.activeElement.tagName!=="INPUT") render();
  }
}, 5000);

/* =========================================================
   INIT
   ========================================================= */
S.matches = MOCK_MATCHES;
render();
</script>
