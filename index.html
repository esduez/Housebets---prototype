<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Housebets — Pro Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  --bg:#0b141c; --surface:#121c24; --surface-2:#192833; --surface-3:#233442;
  --border:#1c2a36; --text:#ffffff; --text-2:#8b9eb0; --accent:#00e5ff;
  --live:#ff4444; --warn:#ffaa00; --radius:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-feature-settings:'tnum';-webkit-font-smoothing:antialiased;padding-bottom:80px}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{display:none}

/* Header & Logo */
.logo-font{font-family:'Poppins',sans-serif;letter-spacing:-0.04em}
.btn-login{background:var(--surface-2);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-weight:700;font-size:13px;transition:background .2s}
.btn-register{background:#c4f8ff;color:#003b45;border:none;padding:8px 16px;border-radius:8px;font-weight:800;font-size:13px;transition:background .2s}
.btn-register:hover{background:var(--accent);color:#000}
.icon-nav-btn{color:var(--text-2);font-size:22px;position:relative;background:none;border:none;display:flex;align-items:center;justify-content:center;transition:color .2s;padding:8px}
.icon-nav-btn:hover, .icon-nav-btn.active{color:#fff}
.icon-nav-btn .badge{position:absolute;top:2px;right:2px;background:var(--live);width:8px;height:8px;border-radius:50%}

/* Pills & Tabs */
.pill{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--text-2);transition:all .2s;display:flex;align-items:center;gap:6px}
.pill.active{background:var(--surface-2);color:#fff;border-color:var(--surface-3)}
.tab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:700;color:var(--text-2);border-bottom:2px solid transparent;cursor:pointer}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* Match Cards */
.match-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;cursor:pointer;transition:border-color .2s;display:flex;flex-direction:column}
.match-card:hover{border-color:var(--accent)}
.match-header{display:flex;justify-content:space-between;font-size:11px;color:var(--text-2);margin-bottom:16px;font-weight:600}
.match-teams{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding:0 10px}
.team-block{display:flex;flex-direction:column;align-items:center;gap:8px;width:35%}
.team-logo{width:48px;height:48px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#000}
.team-name{font-size:13px;font-weight:700;text-align:center}
.match-score{display:flex;flex-direction:column;align-items:center;justify-content:center;width:30%}
.score-num{font-size:24px;font-weight:900;color:var(--accent);line-height:1.1}

/* Odds Grid */
.market-title{text-align:center;font-size:11px;color:var(--text-2);font-weight:600;margin-bottom:8px}
.odds-grid{display:grid;gap:8px}
.odds-btn{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px;display:flex;justify-content:space-between;align-items:center;color:var(--text);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;transition:all .15s}
.odds-btn:hover{border-color:var(--accent);background:var(--surface-3)}
.odds-btn.sel{background:var(--accent);color:#000;border-color:var(--accent);font-weight:900}
.odds-btn.chg{background:var(--warn);color:#000;border-color:var(--warn);font-weight:900}
.odds-btn.susp{opacity:.3;text-decoration:line-through;cursor:not-allowed}
.odds-label{font-size:12px;color:var(--text-2);font-weight:500}
.odds-btn.sel .odds-label{color:rgba(0,0,0,0.7);font-weight:700}

/* YAMI İstatistik Paneli (Analytics) */
.stat-bar-container{margin-bottom:12px}
.stat-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-2);font-weight:600;margin-bottom:4px}
.stat-bar{height:6px;background:var(--surface-3);border-radius:3px;overflow:hidden;display:flex}
.stat-bar-home{background:var(--accent);height:100%}
.stat-bar-away{background:var(--text-2);height:100%}
.model-box{background:rgba(0,229,255,0.05);border:1px solid rgba(0,229,255,0.2);border-radius:8px;padding:12px;margin-bottom:8px}
.model-title{font-size:12px;font-weight:800;color:var(--accent);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.model-val{font-size:13px;font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between}
.model-val span:last-child{color:#fff;font-weight:800}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.bnav-item{flex:1;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--text-2);background:none;border:none;transition:color .2s}
.bnav-item.active{color:var(--accent)}
.bnav-icon{font-size:22px}
.fab-slip{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;background:#c4f8ff;color:#003b45;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 16px rgba(0,229,255,0.4);z-index:45;cursor:pointer}

/* Slip */
.slip-item{border-bottom:1px solid var(--border);padding:12px 0}
.badge{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:800}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:8px;font-size:13px;font-weight:700;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,0.5);animation:slideDown .3s}
@keyframes slideDown{from{top:60px;opacity:0}to{top:80px;opacity:1}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================
   MOCK VERİ — Yami Tarzı (xG, İstatistik)
   ============================================ */
var MOCK_MATCHES = [
  // Görseldeki maç
  {id:1,sport:"football",league:"France › Ligue 1",home:"ESTAC Troyes",away:"Le Havre AC",hs:0,as:0,min:-90,live:false,odds:[2.02,3.55,3.45],timeStr:"Nov 20, 22:45",xg:[1.2,0.8]},
  // Canlı maçlar
  {id:2,sport:"football",league:"UEFA Europa League",home:"Celtic",away:"Besiktas",hs:1,as:1,min:76,live:true,odds:[2.96,3.85,2.16],xg:[1.5,1.1],poss:[48,52],shots:[8,6]},
  {id:3,sport:"football",league:"Premier League",home:"Arsenal",away:"Brighton",hs:2,as:1,min:67,live:true,odds:[2.10,3.40,3.60],xg:[2.1,0.9],poss:[58,42],shots:[12,5]},
  {id:4,sport:"football",league:"LaLiga",home:"Real Madrid",away:"Sevilla",hs:1,as:0,min:54,live:true,odds:[1.35,5.00,8.50],xg:[1.8,0.3],poss:[62,38],shots:[10,3]},
  // Yaklaşan
  {id:5,sport:"football",league:"Premier League",home:"Liverpool",away:"Everton",hs:0,as:0,min:-90,live:false,odds:[1.45,4.20,6.50],timeStr:"Today 20:00",xg:[1.9,0.7]},
  {id:6,sport:"football",league:"LaLiga",home:"Barcelona",away:"Atletico",hs:0,as:0,min:-180,live:false,odds:[1.95,3.40,3.80],timeStr:"Today 21:30",xg:[1.4,1.2]}
];

var S = {
  route:"home", mid:1, matches:[],
  slip:[], stake:10, bets:[], search:"", toast:null, susp:{}, balance:1250.00,
  matchTab:"Markets" // "Markets" veya "Stats"
};

/* ============================================
   HELPERS
   ============================================ */
function go(r){location.hash="#/"+r}
function byId(id){for(var i=0;i<S.matches.length;i++)if(S.matches[i].id===id)return S.matches[i];return null}
function live(){return S.matches.filter(function(m){return m.live})}
function upcoming(){return S.matches.filter(function(m){return !m.live})}
function potential(){return S.slip.reduce(function(a,s){return s.status==="ok"?a+S.stake*s.od:a},0)}
function slipKey(s){return s.mid+"|"+s.mkt+"|"+s.pick}
function isSusp(k){if(!(k in S.susp))S.susp[k]=Math.random()<0.05;return S.susp[k]}
function clock(m){ if(m.live) return m.min+"'"; return m.timeStr || "Soon"; }
function toast(t,ok){S.toast={t:t,ok:ok};render();setTimeout(function(){S.toast=null;render()},3000)}
function fmt(n){return Number(n).toFixed(2)}
function getLogo(name){
  var colors = ["#0a2e5c", "#670d1d", "#0a4a2b", "#4a1c66", "#8c6b0a"];
  var color = colors[name.length % colors.length];
  return '<div class="team-logo" style="background:'+color+';color:#fff">'+name.charAt(0)+'</div>';
}

/* ============================================
   SLIP & BETTING
   ============================================ */
function add(m,mkt,pick,od){
  var s={mid:m.id,lbl:m.home+" v "+m.away,mkt:mkt,pick:pick,od:od,status:"ok",old:od};
  var k=slipKey(s);var ex=null;
  for(var i=0;i<S.slip.length;i++)if(slipKey(S.slip[i])===k)ex=S.slip[i];
  if(ex){S.slip=S.slip.filter(function(x){return slipKey(x)!==k});return render()}
  var r=Math.random();
  if(r<0.15){s.status="changed";s.old=od;s.od=+(od+(Math.random()*0.2-0.1)).toFixed(2)}
  else if(r<0.25){s.status="susp"}
  S.slip.push(s);render();
}
function acceptOdds(k){for(var i=0;i<S.slip.length;i++)if(slipKey(S.slip[i])===k)S.slip[i].status="ok";render()}
function removeSel(k){S.slip=S.slip.filter(function(x){return slipKey(x)!==k});render()}
function placeBet(){
  if(!S.slip.length||S.slip.some(function(s){return s.status!=="ok"}))return;
  if(potential()>S.balance)return toast("Yetersiz bakiye",false);
  S.slip.forEach(function(s){
    S.bets.unshift({id:Date.now()+Math.random(),lbl:s.lbl,pick:s.pick,mkt:s.mkt,od:s.od,st:S.stake,state:"open",tm:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})})
  });
  S.balance-=S.stake*S.slip.length;
  S.slip=[];go("bets");toast("Bahis başarıyla oluşturuldu",true);
}

/* ============================================
   UI COMPONENTS
   ============================================ */
function oddsBtn(m,mkt,pick,od,label){
  var k=m.id+"|"+mkt+"|"+pick;var sel=null;
  for(var i=0;i<S.slip.length;i++)if(slipKey(S.slip[i])===k)sel=S.slip[i];
  var cls="odds-btn";
  if(sel)cls+=sel.status==="susp"?" susp":sel.status==="changed"?" chg":" sel";
  return '<button class="'+cls+'" onclick="event.stopPropagation();add(byId('+m.id+'),\''+mkt+'\',\''+pick+'\','+od+')"><span class="odds-label">'+label+'</span><span>'+fmt(od)+'</span></button>';
}

function matchRow(m){
  var isLive = m.live;
  var h = '<div class="match-card" onclick="go(\'match/'+m.id+'\')">';
  h += '<div class="match-header"><div>⚽ '+m.league+'</div><div>'+clock(m)+'</div></div>';
  h += '<div class="match-teams">';
  h += '<div class="team-block">'+getLogo(m.home)+'<div class="team-name">'+m.home+'</div></div>';
  h += '<div class="match-score">' + (isLive ? '<div class="score-num">'+m.hs+'</div><div class="score-num">'+m.as+'</div>' : '<div style="font-size:16px;font-weight:800;color:var(--text-2)">vs</div>') + '</div>';
  h += '<div class="team-block">'+getLogo(m.away)+'<div class="team-name">'+m.away+'</div></div>';
  h += '</div>';
  h += '<div class="market-title">1x2</div>';
  h += '<div class="odds-grid" style="grid-template-columns:1fr 1fr 1fr">';
  h += oddsBtn(m,"1x2",m.home,m.odds[0],"1");
  h += oddsBtn(m,"1x2","draw",m.odds[1],"draw");
  h += oddsBtn(m,"1x2",m.away,m.odds[2],"2");
  h += '</div></div>';
  return h;
}

/* ============================================
   PAGES
   ============================================ */
function pageHome(){
  var h='<div style="display:flex;gap:8px;overflow-x:auto;padding:16px 0 20px">';
  h+='<div class="pill active"><span>👑</span> Popular</div>';
  h+='<div class="pill" style="color:var(--live)"><span>📡</span> Live</div>';
  h+='<div class="pill"><span>🕒</span> Upcoming</div>';
  h+='</div>';
  var liv=live();
  if(liv.length>0){
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h2 class="text-[16px] font-bold text-white">Live Now</h2></div>';
    h+=liv.map(matchRow).join("");
  }
  var up=upcoming();
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;margin-top:20px"><h2 class="text-[16px] font-bold text-white">Upcoming</h2></div>';
  h+=up.map(matchRow).join("");
  return h;
}

function pageMatch(){
  var m=byId(S.mid);if(!m)return'<div class="card p-6 text-center text-gray-400">Match not found</div>';
  var h='<button style="background:none;border:none;color:var(--text-2);font-size:13px;font-weight:600;cursor:pointer;margin-bottom:16px;padding:0" onclick="go(\'home\')">← Geri Dön</button>';
  
  // Skorboard
  h+='<div class="card p-6 mb-4 text-center">';
  h+='<div style="font-size:12px;color:var(--text-2);margin-bottom:16px;font-weight:600">'+m.league+'</div>';
  h+='<div style="display:flex;justify-content:center;align-items:center;gap:24px">';
  h+='<div style="display:flex;flex-direction:column;align-items:center;gap:8px">'+getLogo(m.home)+'<div style="font-size:14px;font-weight:800">'+m.home+'</div></div>';
  h+='<div style="font-size:28px;font-weight:900;color:var(--accent)">'+(m.live?m.hs+" - "+m.as:"vs")+'</div>';
  h+='<div style="display:flex;flex-direction:column;align-items:center;gap:8px">'+getLogo(m.away)+'<div style="font-size:14px;font-weight:800">'+m.away+'</div></div>';
  h+='</div></div>';

  // SEKMELER (Yami Tarzı)
  h+='<div style="display:flex;background:var(--surface);border-radius:12px;margin-bottom:16px;border:1px solid var(--border);overflow:hidden">';
  h+='<div class="tab '+(S.matchTab==="Markets"?"active":"")+'" onclick="S.matchTab=\'Markets\';render()">Marketler</div>';
  h+='<div class="tab '+(S.matchTab==="Stats"?"active":"")+'" onclick="S.matchTab=\'Stats\';render()">📊 İstatistik & Analiz</div>';
  h+='</div>';

  if(S.matchTab === "Markets"){
    var mk=[
      ["Match Result (1x2)",[m.home,"draw",m.away],m.odds,["1","draw","2"]],
      ["Both Teams to Score",["Yes","No"],[1.72,2.05],["Yes","No"]],
      ["Total Goals 2.5",["Over","Under"],[1.88,1.92],["Over","Under"]]
    ];
    mk.forEach(function(g){
      var k=m.id+"|Detail|"+g[0];var su=isSusp(k);
      h+='<div class="card p-4 mb-3"><div class="flex justify-between items-center mb-3"><div class="text-[13px] font-bold">'+g[0]+'</div></div>';
      h+='<div class="odds-grid '+(g[1].length===2?"grid-cols-2":"grid-cols-3")+'">';
      g[1].forEach(function(p,i){
        h+=su?'<button class="odds-btn susp"><span class="odds-label">'+g[3][i]+'</span><span>'+fmt(g[2][i])+'</span></button>':oddsBtn(m,g[0],p,g[2][i],g[3][i]);
      });
      h+='</div></div>';
    });
  } else {
    // YAMI İSTATİSTİK PANELİ
    h+='<div class="card p-4 mb-4">';
    h+='<h3 style="font-size:14px;font-weight:800;margin-bottom:16px;color:#fff">Canlı Maç İstatistikleri</h3>';
    
    // Topa Sahip Olma
    var poss = m.poss || [50,50];
    h+='<div class="stat-bar-container">';
    h+='<div class="stat-label"><span>'+m.home+' %'+poss[0]+'</span><span>Topa Sahip Olma</span><span>%'+poss[1]+' '+m.away+'</span></div>';
    h+='<div class="stat-bar"><div class="stat-bar-home" style="width:'+poss[0]+'%"></div><div class="stat-bar-away" style="width:'+poss[1]+'%"></div></div>';
    h+='</div>';

    // Şutlar
    var shots = m.shots || [0,0];
    h+='<div class="stat-bar-container">';
    h+='<div class="stat-label"><span>'+shots[0]+'</span><span>Toplam Şut</span><span>'+shots[1]+'</span></div>';
    h+='<div class="stat-bar"><div class="stat-bar-home" style="width:'+(shots[0]/(shots[0]+shots[1]||1)*100)+'%"></div><div class="stat-bar-away" style="width:'+(shots[1]/(shots[0]+shots[1]||1)*100)+'%"></div></div>';
    h+='</div>';

    // xG (Beklenen Gol)
    var xg = m.xg || [0,0];
    h+='<div class="stat-bar-container">';
    h+='<div class="stat-label"><span>'+xg[0].toFixed(2)+'</span><span style="color:var(--accent);font-weight:800">xG (Beklenen Gol)</span><span>'+xg[1].toFixed(2)+'</span></div>';
    h+='<div class="stat-bar"><div class="stat-bar-home" style="width:'+(xg[0]/(xg[0]+xg[1]||1)*100)+'%"></div><div class="stat-bar-away" style="width:'+(xg[1]/(xg[0]+xg[1]||1)*100)+'%"></div></div>';
    h+='</div>';
    h+='</div>';

    // YAMI ORAN MOTORU ANALİZİ
    h+='<div class="card p-4 mb-4">';
    h+='<h3 style="font-size:14px;font-weight:800;margin-bottom:16px;color:#fff;display:flex;align-items:center;gap:8px"><span>🤖</span> Yami Oran Motoru</h3>';
    
    // Poisson Simülasyonu
    h+='<div class="model-box">';
    h+='<div class="model-title"><span>📈</span> Poisson Dağılımı</div>';
    h+='<div class="model-val"><span>Ev Sahibi Kazanma İhtimali</span><span>%'+(Math.random()*20+40).toFixed(1)+'</span></div>';
    h+='<div class="model-val"><span>Beraberlik İhtimali</span><span>%'+(Math.random()*10+20).toFixed(1)+'</span></div>';
    h+='<div class="model-val"><span>Deplasman Kazanma İhtimali</span><span>%'+(Math.random()*20+15).toFixed(1)+'</span></div>';
    h+='</div>';

    // Kelly Kriteri
    h+='<div class="model-box" style="border-color:rgba(255,170,0,0.3);background:rgba(255,170,0,0.05)">';
    h+='<div class="model-title" style="color:var(--warn)"><span>🎯</span> Kelly Kriteri (Değer Bahsi)</div>';
    h+='<div class="model-val"><span>Önerilen Bahis: <b>Ev Sahibi</b></span><span>%'+(Math.random()*5+2).toFixed(1)+' Bakiye</span></div>';
    h+='<div class="model-val"><span>Adil Oran / Piyasa Oranı</span><span style="color:var(--warn)">1.95 / '+m.odds[0]+'</span></div>';
    h+='</div>';
    h+='</div>';
  }
  return h;
}

/* ============================================
   SLIP & BETS
   ============================================ */
function slipBody(){
  if(!S.slip.length)return'<div style="text-align:center;padding:30px 10px;color:var(--text-2)"><div style="font-size:28px;margin-bottom:8px;opacity:0.4">🧾</div><div style="font-size:13px;font-weight:700;color:#fff">Kuponunuz boş</div></div>';
  var bad=S.slip.some(function(s){return s.status!=="ok"});
  var h='<div>'+S.slip.map(function(s){
    var k=slipKey(s);
    var badge = s.status==="susp"?'<span class="badge" style="background:rgba(255,68,68,0.2);color:#ff8a80">ASKIDA</span>':s.status==="changed"?'<span class="badge" style="background:rgba(255,170,0,0.2);color:var(--warn)">ORAN DEĞİŞTİ</span>':'';
    var sh = '<div class="slip-item"><div class="flex justify-between mb-1"><div style="font-size:11px;color:var(--text-2);font-weight:600">'+s.lbl+'</div><button style="background:none;border:none;color:var(--text-2);font-size:14px" onclick="removeSel(\''+k+'\')">✕</button></div>';
    sh += '<div class="flex justify-between items-center"><div style="font-size:13px;font-weight:800">'+s.pick+' '+badge+'</div><div style="font-size:14px;font-weight:900;color:var(--accent)">'+fmt(s.od)+'</div></div>';
    if(s.status==="changed")sh += '<button style="width:100%;background:rgba(255,170,0,0.1);color:var(--warn);border:1px solid var(--warn);padding:6px;border-radius:6px;font-size:11px;font-weight:800;margin-top:8px" onclick="acceptOdds(\''+k+'\')">Yeni Oranı Kabul Et ('+fmt(s.od)+')</button>';
    sh += '</div>';
    return sh;
  }).join("")+'</div>';
  
  h+='<div style="background:var(--bg);border-radius:10px;padding:14px;margin-top:14px;border:1px solid var(--border)">';
  h+='<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-2);margin-bottom:6px"><span>Bahis Miktarı (USDT)</span><span>Tekli Bahis</span></div>';
  h+='<input type="number" value="'+S.stake+'" oninput="S.stake=+this.value||0;render()" style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:14px;font-weight:800;color:#fff;outline:none">';
  h+='<div style="display:flex;justify-content:space-between;font-size:13px;margin-top:10px"><span style="color:var(--text-2)">Tahmini Kazanç</span><span style="font-weight:900;color:var(--accent)">'+fmt(potential())+' USDT</span></div>';
  h+='<button '+(bad?"disabled":"")+' onclick="placeBet()" style="width:100%;margin-top:12px;padding:14px;border-radius:8px;font-weight:900;font-size:14px;border:none;cursor:pointer;'+(bad?"background:var(--surface-3);color:var(--text-2);cursor:not-allowed":"background:var(--accent);color:#000")+'">'+(bad?"Seçimleri kontrol edin":"Bahis Yap →")+'</button>';
  return h+'</div>';
}
function pageBets(){
  var h='<h1 class="text-xl font-bold mb-4">Kupon & Bahislerim</h1><div class="grid grid-cols-1 md:grid-cols-2 gap-4">';
  h+='<div class="card p-4"><div class="flex justify-between items-center mb-3"><h2 class="text-[14px] font-bold text-white">Kupon</h2></div>'+slipBody()+'</div>';
  h+='<div class="card p-4"><h2 class="text-[14px] font-bold mb-3 text-white">Geçmiş Bahisler</h2>';
  if(S.bets.length){
    S.bets.forEach(function(b){
      h+='<div class="slip-item"><div style="font-size:11px;color:var(--text-2);margin-bottom:4px">'+b.tm+' - Tekli</div><div style="font-size:13px;font-weight:800">'+b.pick+'</div><div style="font-size:11px;color:var(--text-2);margin-top:4px">Miktar: '+b.st+' USDT | Oran: '+fmt(b.od)+'</div></div>';
    });
  } else {
    h+='<div style="text-align:center;padding:30px;color:var(--text-2)">Henüz bahis yok.</div>';
  }
  return h+'</div></div>';
}

/* ============================================
   SHELL
   ============================================ */
function shell(html){
  var h='';
  h+='<header style="background:var(--bg);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30">';
  h+='<div class="logo-font" style="font-size:22px;font-weight:900;cursor:pointer" onclick="go(\'home\')"><span style="color:var(--accent)">H</span><span style="color:#fff">ousebets</span></div>';
  h+='<div style="display:flex;gap:8px"><button class="btn-login">Giriş yap</button><button class="btn-register">Kayıt ol</button></div></header>';

  h+='<div style="background:var(--surface);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:4px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:60px;z-index:29">';
  h+='<button class="icon-nav-btn" onclick="go(\'home\')">🏠</button>';
  h+='<button class="icon-nav-btn" onclick="go(\'live\')" style="font-size:12px;font-weight:900;border:1px solid var(--text-2);border-radius:4px;padding:4px 8px">LIVE</button>';
  h+='<button class="icon-nav-btn">⭐</button>';
  h+='<button class="icon-nav-btn" onclick="go(\'bets\')">🧾</button>';
  h+='<div style="width:1px;height:24px;background:var(--border);margin:0 8px"></div>';
  h+='<button class="icon-nav-btn active" onclick="go(\'football\')">⚽<span class="badge"></span></button>';
  h+='<button class="icon-nav-btn">🔍</button>';
  h+='</div>';

  h+='<div style="max-width:768px;margin:0 auto;padding:16px">'+html+'</div>';

  h+='<div class="bottom-nav md:hidden">';
  h+='<button class="bnav-item"><span class="bnav-icon">☰</span>Menü</button>';
  h+='<button class="bnav-item active" onclick="go(\'home\')"><span class="bnav-icon">🏀</span>Spor</button>';
  h+='<button class="bnav-item"><span class="bnav-icon">🎰</span>Casino</button>';
  h+='<button class="bnav-item"><span class="bnav-icon">💬</span>Sohbet</button>';
  h+='<button class="bnav-item"><span class="bnav-icon">🔍</span>Ara</button>';
  h+='</div>';

  if(S.slip.length>0)h+='<div class="fab-slip" onclick="go(\'bets\')">🧾</div>';
  if(S.toast)h+='<div class="toast" style="background:'+(S.toast.ok?"var(--accent);color:#000":"var(--live);color:#fff")+'">'+S.toast.t+'</div>';
  return h;
}

function norm(){
  var h=location.hash.replace("#/","").split("/");
  S.route=h[0]||"home";
  if(h[0]==="match"&&h[1])S.mid=+h[1];
}
function render(){
  var pages={home:pageHome,live:pageHome,football:pageHome,match:pageMatch,bets:pageBets}; // live ve football şimdilik home'a yönlendiriyor
  document.getElementById("app").innerHTML=shell((pages[S.route]||pageHome)());
}
window.addEventListener("hashchange",function(){norm();render()});

// Canlı simülasyon
setInterval(function(){
  if(S.route==="home"||S.route==="match"){
    var updated=false;
    S.matches.forEach(function(m){ 
      if(m.live){ 
        m.min++; updated=true; 
        if(Math.random()<0.05){ if(Math.random()<0.5) m.hs++; else m.as++; }
      } 
    });
    if(updated && document.activeElement.tagName!=="INPUT") render();
  }
}, 5000);

norm();
S.matches = MOCK_MATCHES;
render();
</script>
